<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#131A20"><title>Acionador.ai · Conectar WhatsApp</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d1115;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(540px,100%);background:#131a20;border:1px solid #2c3944;border-radius:24px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.35)}h1{margin:0 0 8px;font-size:26px}p{color:#96a4b0;line-height:1.5}.box{margin-top:18px;min-height:330px;background:#0f151a;border:1px dashed #3b4a56;border-radius:18px;display:grid;place-items:center;padding:16px;text-align:center}.box img{width:min(360px,100%);background:#fff;padding:10px;border-radius:14px}.status{margin-top:14px;padding:12px 14px;border-radius:13px;background:#352d1d;border:1px solid #5a4927;color:#f5d28e;font-weight:700}.status.ok{background:#163127;border-color:#245c45;color:#a8e6c7}.status.bad{background:#392128;border-color:#6b303b;color:#ffb3bc}.btn{width:100%;margin-top:14px;border:0;border-radius:13px;padding:13px;background:#6fa6ff;color:#10161c;font-weight:900;cursor:pointer}.small{font-size:12px;color:#71808c;margin-top:12px}</style></head><body><main class="card"><h1>Conectar WhatsApp</h1><p>Abra no computador e escaneie pelo WhatsApp do celular em <b>Aparelhos conectados → Conectar aparelho</b>.</p><div id="qr" class="box">Buscando QR Code…</div><div id="status" class="status">Verificando sessão…</div><button id="refresh" class="btn">Atualizar QR</button><div class="small">Esta tela consulta diretamente a sessão operacional do Acionador.ai.</div></main><script>const q=new URLSearchParams(location.search);const companyId=q.get('companyId')||'cliente-teste';const qr=document.getElementById('qr'),st=document.getElementById('status');async function load(){try{const r=await fetch('/api/worker/status?companyId='+encodeURIComponent(companyId)+'&_='+Date.now(),{cache:'no-store',headers:{'x-botguincho-company-id':companyId}});const d=await r.json();if(!r.ok)throw new Error(d.error||d.message||'HTTP '+r.status);const s=d?.whatsapp?.status||'iniciando',img=d?.whatsapp?.qrDataUrl||'';if(s==='pronto'||s==='ready'){qr.innerHTML='<div><b>WhatsApp conectado ✅</b><p>Você já pode fechar esta tela.</p></div>';st.textContent='Sessão conectada e pronta.';st.className='status ok';return}if(img){qr.innerHTML='<img alt="QR Code do WhatsApp" src="'+img+'">';st.textContent='QR pronto. Escaneie agora pelo celular.';st.className='status';return}qr.textContent='QR ainda não chegou. Tentando novamente…';st.textContent='Estado atual: '+s;st.className='status'}catch(e){qr.textContent='Não foi possível carregar o QR.';st.textContent='Erro: '+e.message;st.className='status bad'}}document.getElementById('refresh').onclick=load;load();setInterval(load,3000);</script></body></html>
