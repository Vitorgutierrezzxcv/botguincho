<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#131A20"><title>Acionador.ai · Entrar</title><link rel="stylesheet" href="/app.css"><style>.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(440px,100%)}.login-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:13px;line-height:1.5;margin-top:12px}@media(max-width:520px){.login-actions{grid-template-columns:1fr}}</style></head><body><div class="login-wrap"><div class="card login-card"><img class="auth-brand-icon" src="/icon.svg" alt="Acionador.ai"><div class="eyebrow">ACIONADOR.AI</div><h2>Entrar na empresa</h2><p class="muted">Acesse somente a operação vinculada ao seu usuário.</p><div class="field section"><label>E-mail</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Senha</label><input id="password" type="password" minlength="8" autocomplete="current-password" placeholder="mínimo 8 caracteres"></div><div id="notice" class="notice section" style="display:none"></div><div class="login-actions section"><button id="login" class="btn">Entrar</button><button id="firstAccess" class="btn secondary">Primeiro acesso</button></div><button id="forgotPassword" class="btn secondary" style="width:100%;margin-top:10px">Esqueci minha senha</button><p class="muted hint" id="loginHint">Use “Primeiro acesso” se a administração já convidou este e-mail. Você escolhe sua própria senha; ela é enviada diretamente ao Supabase Auth.</p></div></div><script src="/login.js" defer></script><script src="/branding.js" defer></script></body></html>
