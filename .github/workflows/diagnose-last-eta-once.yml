name: Diagnose Last ETA Once
on:
  push:
    paths: ['.github/workflows/diagnose-last-eta-once.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnosticar produção
        run: |
          set -e
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 'https://botguincho.vercel.app/api/worker/status?companyId=cliente-teste' -o /tmp/status.json
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 'https://botguincho.vercel.app/api/worker/activity?companyId=cliente-teste' -o /tmp/activity.json
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --get --data-urlencode 'address=RUA JOSE AUGUSTO DE OLIVEIRA 175, PETROPOLIS, BETIM, MG' 'https://botguincho.vercel.app/api/worker/route-test?companyId=cliente-teste' -o /tmp/route.json || true
          node <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/status.json','utf8'));
          const a=JSON.parse(fs.readFileSync('/tmp/activity.json','utf8'));
          let r={}; try{r=JSON.parse(fs.readFileSync('/tmp/route.json','utf8'))}catch{}
          const events=(a.activity||a.events||[]).slice(0,30).map(x=>({at:x.at,type:x.type,message:x.message,meta:x.meta}));
          fs.mkdirSync('ops',{recursive:true});
          fs.writeFileSync('ops/last-eta-diagnostic.json',JSON.stringify({checkedAt:new Date().toISOString(),whatsapp:s.whatsapp?.status,tracker:s.tracker,routeTest:r,events},null,2));
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/last-eta-diagnostic.json
          git commit -m 'Registra diagnóstico do último ETA' || exit 0
          git push
