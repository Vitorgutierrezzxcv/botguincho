name: Fix Processed IDs Once
on:
  push:
    paths:
      - 'tools/fix_processed_ids_tmp.py'
      - '.github/workflows/fix-processed-ids-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fix_processed_ids_tmp.py
      - run: |
          node --check tools/vercel-whatsapp-worker.mjs
          grep -q 'const processedMessageIds = new Map();' tools/vercel-whatsapp-worker.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/vercel-whatsapp-worker.mjs
          git diff --cached --quiet || git commit -m 'Corrige processamento de mensagens do WhatsApp'
          git push
