name: Validate GConnect Self Heal
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-gconnect-self-heal.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          set -e
          node --check tools/gconnect-emulator-agent.mjs
          bash -n tools/install-gconnect-agent.sh
          grep -q 'GConnect Android Agent v3' tools/gconnect-emulator-agent.mjs
          grep -q 'botguincho-gconnect-watchdog.timer' tools/install-gconnect-agent.sh
          grep -q 'GCONNECT_HEARTBEAT_FILE' tools/install-gconnect-agent.sh
          echo SELF_HEAL_SCRIPTS_OK
