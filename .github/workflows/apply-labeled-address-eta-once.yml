name: Apply Labeled Address ETA Once
on:
  push:
    paths: ['.github/workflows/apply-labeled-address-eta-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: |
          python tools/fix_labeled_address_eta_tmp.py
          node --check tools/vercel-whatsapp-worker.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/vercel-whatsapp-worker.mjs
          git commit -m 'Corrige ETA para endereços com bairro cidade e estado' || true
          git push
      - name: Aguardar deploy
        run: sleep 30
      - name: Atualizar worker persistente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 --max-time 180 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Content-Type: application/json' \
            'https://botguincho.vercel.app/api/worker/reload?companyId=cliente-teste' -o /tmp/reload.json
          cat /tmp/reload.json
          sleep 20
      - name: Validar casos reais
        run: |
          set -e
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --get --data-urlencode 'address=RUA JOSE AUGUSTO DE OLIVEIRA 175, BAIRRO: PETROPOLIS, CIDADE: BETIM, ESTADO: MG, PAS: BRASIL' 'https://botguincho.vercel.app/api/worker/route-test?companyId=cliente-teste' -o /tmp/honda.json
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --get --data-urlencode 'address=RODOVIA SENADOR ELISEU RESENDE - BAIRRO: BOA VISTA DA SERRA, CIDADE: JUATUBA, ESTADO: MINAS GERAIS' 'https://botguincho.vercel.app/api/worker/route-test?companyId=cliente-teste' -o /tmp/juatuba.json
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 'https://botguincho.vercel.app/api/worker/health?companyId=cliente-teste' -o /tmp/health.json
          cat /tmp/honda.json; echo
          cat /tmp/juatuba.json; echo
          jq -e '.ok == true and (.minutes|type)=="number"' /tmp/honda.json >/dev/null
          jq -e '.ok == true and (.minutes|type)=="number"' /tmp/juatuba.json >/dev/null
          jq -e '.checks.whatsapp.ok == true and .checks.tracker.ok == true' /tmp/health.json >/dev/null
          node <<'NODE'
          const fs=require('fs'); const h=JSON.parse(fs.readFileSync('/tmp/honda.json')); const j=JSON.parse(fs.readFileSync('/tmp/juatuba.json')); const health=JSON.parse(fs.readFileSync('/tmp/health.json')); fs.mkdirSync('ops',{recursive:true}); fs.writeFileSync('ops/labeled-address-eta-validation.json',JSON.stringify({checkedAt:new Date().toISOString(),honda:h,juatuba:j,whatsapp:health.checks?.whatsapp?.status,tracker:health.checks?.tracker},null,2));
          NODE
          git pull --rebase
          git add ops/labeled-address-eta-validation.json
          git commit -m 'Valida ETA para formatos de seguradora' || true
          git push
