name: Apply Preview Consistency Fix

on:
  push:
    branches:
      - fix/preview-consistency-20260828

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar patch e trocar para main
        run: |
          set -euo pipefail
          cp tools/apply_preview_consistency_fix_tmp.py /tmp/apply_preview_consistency_fix.py
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Aplicar consistência de prévias
        run: |
          set -euo pipefail
          python3 /tmp/apply_preview_consistency_fix.py

      - name: Validar regressões
        run: |
          set -euo pipefail
          node --check tools/vercel-whatsapp-worker.mjs
          node --check tools/operational-knowledge.mjs
          node tools/test-preview-consistency.mjs
          node tools/test-whatsapp-address-fields.mjs
          node tools/test-operational-knowledge.mjs
          node tools/test-fast-eta.mjs
          node tools/test-simple-operation.mjs

      - name: Publicar somente após testes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/vercel-whatsapp-worker.mjs tools/operational-knowledge.mjs tools/test-preview-consistency.mjs
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'fix: padroniza previas de tempo km e valor'
          git push origin main
