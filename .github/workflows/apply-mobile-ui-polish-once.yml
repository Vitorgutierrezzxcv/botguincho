name: Apply mobile UI polish once

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-mobile-ui-polish.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply mobile UI polish
        run: python tools/apply-mobile-ui-polish.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/acionador-tratto-v2.css
          git commit -m "Refina navegação mobile e cards do Acionador"
          git push origin main
