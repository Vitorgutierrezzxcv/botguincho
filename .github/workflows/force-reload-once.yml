name: Force WhatsApp Reload Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-reload-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  reload:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Atualizar worker persistente imediatamente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          CODE=$(curl -sS -L --max-time 180 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/json" \
            -o /tmp/reload.json \
            -w '%{http_code}' \
            https://botguincho.vercel.app/api/worker/reload || true)
          echo "HTTP $CODE"
          cat /tmp/reload.json
          echo
          test "$CODE" = "200"

          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/reload.json', 'utf8'));
          if (!x.ok) process.exit(1);
          if (x.whatsappStatus !== 'pronto') process.exit(1);
          if (x.workerProcessCount !== 1) process.exit(1);
          if (!Number.isFinite(x.groupsFound) || x.groupsFound < 1) process.exit(1);
          console.log(`Worker atualizado: WhatsApp=${x.whatsappStatus}; grupos=${x.groupsFound}; sessão preservada=${x.sessionPreserved}`);
          NODE

      - name: Conferir status e GConnect
        run: |
          set -e
          curl -sS --fail-with-body https://botguincho.vercel.app/api/worker/status -o /tmp/status.json
          cat /tmp/status.json
          echo
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/status.json', 'utf8'));
          if (x.whatsapp?.status !== 'pronto') process.exit(1);
          if (!x.tracker?.connected) process.exit(1);
          console.log(`Status OK; GConnect=${x.tracker.lastLocation?.address || 'online'}`);
          NODE

      - name: Conferir inteligência operacional
        run: |
          set -e
          curl -sS --fail-with-body -X POST https://botguincho.vercel.app/api/worker/ai-test \
            -H 'content-type: application/json' \
            -d '{"text":"A rua é estreita e precisa de um caminhão menor."}'
          echo

      - name: Mostrar atividade recente do worker
        if: always()
        run: |
          curl -sS https://botguincho.vercel.app/api/worker/activity || true
          echo
