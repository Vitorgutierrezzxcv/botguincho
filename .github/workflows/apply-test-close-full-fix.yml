name: Apply test close full fix

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_test_close_full_tmp.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção
        run: python3 tools/fix_test_close_full_tmp.py

      - name: Validar
        run: |
          set -euo pipefail
          node --check tools/vercel-whatsapp-worker.mjs
          node --check operation-command-center.js
          node --check public/operation-command-center.js
          node --check test-mode-visibility.js
          node --check public/test-mode-visibility.js
          node --check owner-dashboard.js
          node --check public/owner-dashboard.js
          node tools/test-simple-operation.mjs
          node tools/test-driver-payroll.mjs
          grep -q "function ensureTestFinanceTracking" tools/vercel-whatsapp-worker.mjs
          grep -q "allowCloseNotice" tools/vercel-whatsapp-worker.mjs
          grep -q "testFinance" tools/vercel-whatsapp-worker.mjs
          grep -q "test-finance-detail-list" test-mode-visibility.js
          grep -q "Concluindo..." operation-command-center.js
          echo TEST_CLOSE_FULL_FIX_OK

      - name: Publicar
        run: |
          set -euo pipefail
          rm -f tools/fix_test_close_full_tmp.py
          rm -f .github/workflows/apply-test-close-full-fix.yml
          rm -f .github/workflows/fix-test-close-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Completa fechamento de teste no WhatsApp e financeiro"
          git push origin main
