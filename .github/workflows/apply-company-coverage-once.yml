name: Apply Company Coverage Once
on:
  push:
    paths:
      - 'tools/apply_company_coverage_tmp.py'
      - '.github/workflows/apply-company-coverage-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_company_coverage_tmp.py
      - name: Validate
        run: |
          node --check tools/vercel-whatsapp-worker.mjs
          grep -q 'configuredServiceState' tools/vercel-whatsapp-worker.mjs
          grep -q 'priorityCities' tools/vercel-whatsapp-worker.mjs
          grep -q 'serviceArea' tools/vercel-whatsapp-worker.mjs
      - name: Commit and reload
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/vercel-whatsapp-worker.mjs
          git diff --cached --quiet || git commit -m 'Torna cobertura configurável por empresa'
          git push
          sleep 8
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 4 --max-time 180 -X POST https://botguincho.vercel.app/api/worker/reload -o /tmp/reload.json
          cat /tmp/reload.json
          sleep 15
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 4 --max-time 90 https://botguincho.vercel.app/api/worker/status -o /tmp/status.json
          cat /tmp/status.json
          jq -e '.whatsapp.status=="pronto" and .tracker.connected==true and .serviceArea.state=="MG"' /tmp/status.json >/dev/null