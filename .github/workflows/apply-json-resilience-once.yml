name: Apply JSON resilience once

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-json-resilience.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply JSON resilience patch
        run: python tools/apply-json-resilience.py
      - name: Validate worker
        run: node --check tools/vercel-whatsapp-worker.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/vercel-whatsapp-worker.mjs
          git commit -m "Protege JSONs persistentes contra corrupção concorrente"
          git push origin main
