name: Apply Universal Address Location V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-universal-address-location-v4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair e executar patch V2
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/harden-universal-address-location-v2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          lines = src[start:end]
          # O bloco run do YAML adiciona 10 espacos antes do codigo Python.
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-universal.py').write_text(code)
          compile(code, '/tmp/apply-universal.py', 'exec')
          print('Patch Python extraido e compilado.')
          PY
          python3 /tmp/apply-universal.py

      - name: Validar arquivo final
        run: |
          set -e
          node --check tools/vercel-whatsapp-worker.mjs
          grep -q "whatsapp-location" tools/vercel-whatsapp-worker.mjs
          grep -q "whatsapp-quoted-location" tools/vercel-whatsapp-worker.mjs
          grep -q "lastSharedCoordinates" tools/vercel-whatsapp-worker.mjs
          grep -q "BRAZIL_UFS" tools/vercel-whatsapp-worker.mjs
          grep -q "google-maps-url" tools/vercel-whatsapp-worker.mjs
          grep -q "viacep-direct+nominatim" tools/vercel-whatsapp-worker.mjs
          grep -q "toCoordinates" tools/vercel-whatsapp-worker.mjs
          echo "Worker final: sintaxe OK e recursos universais presentes."

      - name: Commitar worker
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/vercel-whatsapp-worker.mjs
          git commit -m 'Generaliza enderecos e localizacao do WhatsApp'
          git push origin HEAD:main
