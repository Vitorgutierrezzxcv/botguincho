name: Change capacity reply once

on:
  push:
    branches: [main]
    paths:
      - 'ops/change-capacity-reply.py'
      - '.github/workflows/change-capacity-reply-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reply change
        run: python ops/change-capacity-reply.py
      - name: Validate syntax
        run: node --check tools/vercel-whatsapp-worker.mjs
      - name: Validate capacity rules
        run: |
          if [ -f tools/test-simple-operation.mjs ]; then node tools/test-simple-operation.mjs; fi
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/vercel-whatsapp-worker.mjs
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Troca resposta de lotação por fora de rota'
          git push
