name: Apply operational knowledge runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[operational-runtime-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply worker patch
        run: python3 tools/apply_operational_runtime_tmp.py
      - name: Syntax checks
        run: |
          node --check tools/learning-engine.mjs
          node --check tools/operational-knowledge.mjs
          node --check tools/vercel-whatsapp-worker.mjs
      - name: Operational regression
        run: node tools/test-operational-knowledge.mjs
      - name: Commit applied runtime
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/vercel-whatsapp-worker.mjs
          git commit -m "Integra conhecimento operacional ao worker [operational-runtime-applied]"
          git push
