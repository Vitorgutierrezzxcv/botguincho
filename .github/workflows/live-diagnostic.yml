name: Live Production Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check production worker
        run: |
          set -e
          echo '=== STATUS ==='
          curl -sS --fail-with-body https://botguincho.vercel.app/api/worker/status || true
          echo
          echo '=== ACTIVITY ==='
          curl -sS --fail-with-body https://botguincho.vercel.app/api/worker/activity || true
          echo
          echo '=== ROUTE TEST ==='
          curl -sS --fail-with-body -X POST https://botguincho.vercel.app/api/worker/route-test \
            -H 'content-type: application/json' \
            -d '{"from":"Rua das Rosas, 310, São Salvador, Betim - Minas Gerais","to":"RUA DOUTOR CAMILO ANTÔNIO NOGUEIRA, nº 100, NOSSA SENHORA DA CONCEIÇÃO, BELO HORIZONTE - MG"}' || true
          echo
          # diagnóstico solicitado em 2026-08-15 15:29 BRT
