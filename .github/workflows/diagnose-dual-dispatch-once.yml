name: Diagnose dual dispatch once

on:
  push:
    branches: [main]
    paths:
      - 'ops/trigger-dual-dispatch-diagnostic.txt'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose and apply
        shell: bash
        run: |
          set +e
          : > /tmp/dual.txt
          echo '### patch' >> /tmp/dual.txt
          python3 tools/apply_dual_dispatch_tmp.py >> /tmp/dual.txt 2>&1
          PATCH=$?
          echo "patch_exit=$PATCH" >> /tmp/dual.txt
          if [ "$PATCH" = 0 ]; then
            echo '### worker syntax' >> /tmp/dual.txt
            node --check tools/vercel-whatsapp-worker.mjs >> /tmp/dual.txt 2>&1
            WORKER=$?
            echo "worker_exit=$WORKER" >> /tmp/dual.txt
            echo '### capacity syntax' >> /tmp/dual.txt
            node --check tools/dispatch-capacity.mjs >> /tmp/dual.txt 2>&1
            CAP=$?
            echo "capacity_exit=$CAP" >> /tmp/dual.txt
            echo '### reload syntax' >> /tmp/dual.txt
            node --check api/worker/reload.js >> /tmp/dual.txt 2>&1
            REL=$?
            echo "reload_exit=$REL" >> /tmp/dual.txt
            if [ "$WORKER" = 0 ] && [ "$CAP" = 0 ] && [ "$REL" = 0 ]; then
              node --input-type=module >> /tmp/dual.txt 2>&1 <<'NODE'
          import assert from 'node:assert/strict';
          import { capacitySnapshot, capSecondCallEta, plannedRemainingMinutes } from './tools/dispatch-capacity.mjs';
          const s={calls:[{id:'1',status:'autorizado',createdAt:'2026-08-19T14:00:00Z'},{id:'2',status:'em_atendimento',createdAt:'2026-08-19T15:00:00Z'}]};
          assert.equal(capacitySnapshot(s).canAccept,false);
          assert.equal(capacitySnapshot(s,'1').canAccept,true);
          assert.equal(capSecondCallEta(95).minutes,60);
          assert.equal(capSecondCallEta(44).minutes,44);
          const r=plannedRemainingMinutes({authorizedAt:'2026-08-19T15:00:00Z',routeBreakdown:{legToOrigin:{minutes:20},serviceLeg:{minutes:30}}},new Date('2026-08-19T15:15:00Z'));
          assert.equal(r,35);
          console.log('capacity_regression=ok');
          NODE
              REG=$?
              echo "regression_exit=$REG" >> /tmp/dual.txt
            fi
          fi
          cp /tmp/dual.txt ops/dual-dispatch-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/dual-dispatch-diagnostic.txt
          if [ "$PATCH" = 0 ] && [ "${WORKER:-1}" = 0 ] && [ "${CAP:-1}" = 0 ] && [ "${REL:-1}" = 0 ] && [ "${REG:-1}" = 0 ]; then
            git add tools/vercel-whatsapp-worker.mjs tools/dispatch-capacity.mjs api/worker/reload.js
            git commit -m "Permite duas corridas simultâneas com ETA em fila [dual-dispatch-ok]" || true
          else
            git commit -m "Registra diagnóstico de duas corridas simultâneas" || true
          fi
          git push
          exit 0
