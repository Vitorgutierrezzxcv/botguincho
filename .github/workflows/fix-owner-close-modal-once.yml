name: Fix owner close modal once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-owner-close-modal-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir fechamento no painel e tornar backend idempotente
        run: |
          python3 - <<'PY'
          from pathlib import Path

          frontend_old = """      const d = await api('/api/worker/management', { method: 'POST', body: JSON.stringify({ action: 'close_call', callId: id, ownerName: data.ownerName || 'Thiago', final: data }) });
      const sent = d.data?.closeResult?.noticeSent;
      await refreshOwner();
      alert(testClosure ? 'Corrida de teste concluída. Valores, KM e fechamento foram processados; o resumo não é enviado ao grupo de teste.' : (sent ? 'Corrida fechada e resumo enviado ao grupo.' : 'Corrida fechada. O WhatsApp não confirmou o envio do resumo; confira o grupo.'));
"""
          frontend_new = """      const saveButton = document.getElementById('modalSave');
      if (saveButton) { saveButton.disabled = true; saveButton.textContent = 'Concluindo...'; }
      try {
        const d = await api('/api/worker/management', { method: 'POST', body: JSON.stringify({ action: 'close_call', callId: id, ownerName: data.ownerName || 'Thiago', final: data }) });
        const sent = d.data?.closeResult?.noticeSent;
        await refreshOwner();
        closeModal();
        alert(testClosure ? 'Corrida de teste concluída ✅ Os dados foram processados e ela saiu dos atendimentos em aberto.' : (sent ? 'Corrida concluída ✅ Resumo enviado ao grupo.' : 'Corrida concluída ✅ O fechamento foi salvo. O WhatsApp não confirmou o resumo; confira o grupo.'));
      } catch (error) {
        if (saveButton) { saveButton.disabled = false; saveButton.textContent = 'Concluir corrida'; }
        throw error;
      }
"""

          for name in ['owner-dashboard.js', 'public/owner-dashboard.js']:
              p = Path(name)
              text = p.read_text()
              if frontend_new in text:
                  continue
              if frontend_old not in text:
                  raise SystemExit(f'Bloco de fechamento não encontrado em {name}')
              p.write_text(text.replace(frontend_old, frontend_new, 1))

          worker = Path('tools/vercel-whatsapp-worker.mjs')
          text = worker.read_text()
          needle = """  const call = state.calls[index];
  // Corridas do grupo de testes também podem ser fechadas pelo dono para validar o fluxo completo.
"""
          replacement = """  const call = state.calls[index];
  // Fechamento é idempotente: clique repetido não duplica financeiro, repasse nem timeline.
  if (call.ownerClosedAt) {
    return { call, noticeSent: false, driverPay: driverPayForCall(call), alreadyClosed: true };
  }
  // Corridas do grupo de testes também podem ser fechadas pelo dono para validar o fluxo completo.
"""
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('Ponto de idempotência não encontrado no worker')
              worker.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Validar sintaxe e testes essenciais
        run: |
          set -euo pipefail
          node --check owner-dashboard.js
          node --check public/owner-dashboard.js
          node --check tools/vercel-whatsapp-worker.mjs
          node tools/test-simple-operation.mjs
          node tools/test-driver-payroll.mjs

      - name: Publicar correção e remover workflow temporário
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-owner-close-modal-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner-dashboard.js public/owner-dashboard.js tools/vercel-whatsapp-worker.mjs .github/workflows/fix-owner-close-modal-once.yml
          git commit -m "Fecha modal após concluir corrida e evita duplicidade"
          git push origin main
