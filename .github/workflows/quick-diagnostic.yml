name: Quick Production Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Aguardar deployment da Vercel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO="$GITHUB_REPOSITORY"
          SHA="$GITHUB_SHA"
          for i in $(seq 1 48); do
            DEPLOYS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA")
            STATUS_URL=$(printf '%s' "$DEPLOYS" | jq -r '.[0].statuses_url // empty')
            if [ -n "$STATUS_URL" ]; then
              STATUSES=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_URL")
              STATE=$(printf '%s' "$STATUSES" | jq -r '.[0].state // empty')
              echo "Vercel state=$STATE"
              if [ "$STATE" = "success" ]; then sleep 8; exit 0; fi
              if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then exit 1; fi
            fi
            sleep 5
          done
          exit 1

      - name: Aguardar QR do WhatsApp
        run: |
          set -e
          URL='https://botguincho.vercel.app/api/worker/status'
          for i in $(seq 1 24); do
            CODE=$(curl -sS -L --max-time 25 -o /tmp/status.json -w '%{http_code}' "$URL")
            echo "status tentativa $i: HTTP $CODE"
            cat /tmp/status.json || true
            echo
            if [ "$CODE" = "200" ]; then
              STATUS=$(node -e "const x=require('/tmp/status.json');console.log(x.whatsapp?.status||'')")
              AI=$(node -e "const x=require('/tmp/status.json');console.log(Boolean(x.ai?.configured))")
              echo "whatsapp=$STATUS aiConfigured=$AI"
              if [ "$STATUS" = "qr" ] || [ "$STATUS" = "autenticado" ] || [ "$STATUS" = "pronto" ]; then
                test "$AI" = "true"
                exit 0
              fi
              if [ "$STATUS" = "erro" ]; then exit 1; fi
            fi
            sleep 8
          done
          exit 1

      - name: Configurar GPT-5 para atendimento
        run: |
          set -e
          CODE=$(curl -sS -L --max-time 25 \
            -H 'content-type: application/json' \
            -d '{"aiEnabled":true,"aiModel":"openai/gpt-5","replyEveryMessage":true,"humanTakeover":false}' \
            -o /tmp/settings.json -w '%{http_code}' \
            https://botguincho.vercel.app/api/worker/settings)
          echo "settings HTTP $CODE"
          cat /tmp/settings.json
          echo
          test "$CODE" = "200"

      - name: Testar interpretação da IA
        run: |
          set -e
          URL='https://botguincho.vercel.app/api/worker/ai-test'
          for i in $(seq 1 6); do
            CODE=$(curl -sS -L --max-time 40 \
              -H 'content-type: application/json' \
              -d '{"text":"Bom dia, preciso de um guincho. Meu carro parou na BR-381 perto de Betim. O que você precisa para seguir?"}' \
              -o /tmp/ai.json -w '%{http_code}' "$URL")
            echo "IA tentativa $i: HTTP $CODE"
            cat /tmp/ai.json || true
            echo
            if [ "$CODE" = "200" ]; then
              node -e "const x=require('/tmp/ai.json'); if(!x.ok || !x.reply || x.reply.length < 5) process.exit(1); console.log('Resposta IA:', x.reply);"
              exit 0
            fi
            sleep 6
          done
          exit 1

      - name: Diagnóstico final
        if: always()
        run: |
          set +e
          curl -sS -L --max-time 30 https://botguincho.vercel.app/api/worker/diagnostics
          echo
