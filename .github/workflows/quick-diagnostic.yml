name: Quick Production Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Aguardar alias de produção
        run: sleep 20
      - name: Consultar status do worker
        run: |
          set +e
          URL='https://botguincho.vercel.app/api/worker/status'
          echo "GET $URL"
          START=$(date +%s)
          CODE=$(curl -sS -L --max-time 20 -D /tmp/headers.txt -o /tmp/body.txt -w '%{http_code}' "$URL")
          EXIT=$?
          END=$(date +%s)
          echo "curl_exit=$EXIT http=$CODE elapsed=$((END-START))s"
          echo '--- headers ---'
          cat /tmp/headers.txt 2>/dev/null || true
          echo '--- body ---'
          cat /tmp/body.txt 2>/dev/null || true
          echo
          exit 0
