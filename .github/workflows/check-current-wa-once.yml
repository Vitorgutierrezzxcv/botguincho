name: Check Current WA Once
on:
  push:
    paths: ['.github/workflows/check-current-wa-once.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar estado
        run: |
          set -e
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 'https://botguincho.vercel.app/api/worker/status?companyId=cliente-teste' -o /tmp/status.json
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 'https://botguincho.vercel.app/api/worker/groups?companyId=cliente-teste' -o /tmp/groups.json
          mkdir -p ops
          jq -n --arg checkedAt "$(date -u +%FT%TZ)" --slurpfile s /tmp/status.json --slurpfile g /tmp/groups.json '{checkedAt:$checkedAt,whatsapp:$s[0].whatsapp.status,groupsCount:($g[0].groups|length),selected:([$g[0].groups[]|select(.selected==true)]|length),names:([$g[0].groups[]?.name][0:15])}' > ops/current-wa.json
          cat ops/current-wa.json
      - name: Salvar diagnóstico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/current-wa.json
          git diff --cached --quiet || git commit -m 'Registra diagnóstico atual do WhatsApp'
          git push
