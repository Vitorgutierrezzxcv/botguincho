name: Reload Inline ETA Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reload-inline-eta-now.yml'

permissions:
  contents: read
  deployments: read

jobs:
  reload:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Aguardar Vercel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for i in $(seq 1 48); do
            DEPLOYS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}")
            STATUS_URL=$(printf '%s' "$DEPLOYS" | jq -r '.[0].statuses_url // empty')
            if [ -n "$STATUS_URL" ]; then
              STATUSES=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_URL")
              STATE=$(printf '%s' "$STATUSES" | jq -r '.[0].state // empty')
              echo "Vercel state=$STATE"
              if [ "$STATE" = "success" ]; then sleep 5; exit 0; fi
              if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then exit 1; fi
            fi
            sleep 5
          done
          exit 1

      - name: Recarregar worker preservando WhatsApp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          CODE=$(curl -sS -L --max-time 120 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-BotGuincho-Source-Ref: $GITHUB_SHA" \
            -H 'Content-Type: application/json' \
            -o /tmp/reload.json -w '%{http_code}' \
            https://botguincho.vercel.app/api/worker/reload)
          echo "HTTP $CODE"
          cat /tmp/reload.json; echo
          test "$CODE" = "200"
          jq -e '.ok == true and .whatsappStatus == "pronto" and .trackerAvailable == true' /tmp/reload.json >/dev/null

      - name: Testar endereco exato do print
        run: |
          set -e
          ADDRESS='Rua pau brasil, 901, vila das flores, Betim Minas Gerais brasil, 32605345'
          CODE=$(curl -sS -L --max-time 60 -X POST \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg to "$ADDRESS" '{fromTracker:true,to:$to}')" \
            -o /tmp/route.json -w '%{http_code}' \
            https://botguincho.vercel.app/api/worker/route-test)
          echo "HTTP $CODE"
          cat /tmp/route.json; echo
          test "$CODE" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/route.json', 'utf8'));
          if (!x.ok || !x.fromTracker) process.exit(1);
          if (!Number.isFinite(x.route?.minutes) || x.route.minutes < 1) process.exit(1);
          if (!Number.isFinite(x.route?.distanceKm) || x.route.distanceKm <= 0) process.exit(1);
          console.log(`ENDERECO_DO_PRINT_OK ETA=${x.route.minutes}min DIST=${x.route.distanceKm}km ORIGEM_GCONNECT=${x.route.trackerAddress}`);
          NODE

      - name: Confirmar GConnect conectado
        run: |
          set -e
          curl -fsSL --max-time 30 https://botguincho.vercel.app/api/worker/tracker -o /tmp/tracker.json
          cat /tmp/tracker.json; echo
          jq -e '.connected == true and .lastLocation.plate == "GSW0H17"' /tmp/tracker.json >/dev/null
