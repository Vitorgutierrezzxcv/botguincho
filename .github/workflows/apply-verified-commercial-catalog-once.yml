name: Apply Verified Commercial Catalog Once
on:
  push:
    paths:
      - '.github/workflows/apply-verified-commercial-catalog-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar catálogo comercial verificado
        shell: bash
        run: |
          cat > /tmp/patch.b64 <<'B64'
          
          B64
          base64 -d /tmp/patch.b64 | gzip -d > /tmp/apply.py
          python3 /tmp/apply.py
      - name: Validar JavaScript e regressões
        run: |
          node --check tools/vercel-whatsapp-worker.mjs
          node --check tools/operational-knowledge.mjs
          node --check tools/verified-commercial-catalog.mjs
          node --check tools/test-verified-commercial-catalog.mjs
          node --check 'api/worker/[...path].js'
          node --check app.js
          node --check public/app.js
          node tools/test-verified-commercial-catalog.mjs
          node tools/test-simple-operation.mjs
          node tools/test-driver-payroll.mjs
          grep -q "verified_catalog" tools/vercel-whatsapp-worker.mjs
          grep -q "/api/commercial-catalog" tools/vercel-whatsapp-worker.mjs
          grep -q "commercial-catalog" 'api/worker/[...path].js'
          grep -q "Tabelas comerciais importadas" app.js
      - name: Remover workflow temporário e publicar
        run: |
          rm -f .github/workflows/apply-verified-commercial-catalog-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/vercel-whatsapp-worker.mjs tools/operational-knowledge.mjs tools/verified-commercial-catalog.mjs tools/test-verified-commercial-catalog.mjs 'api/worker/[...path].js' app.js public/app.js .github/workflows/apply-verified-commercial-catalog-once.yml
          git commit -m 'Importa tabelas comerciais reais para o app'
          git push
