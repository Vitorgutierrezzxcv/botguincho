name: Isolate new tenants once

# One-shot: mantém cliente-teste na VPS e usa sandbox isolado nos novos tenants.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isolate-new-tenants-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Route only legacy tenant to Hostinger
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/sandbox-runtime.js')
          s=p.read_text()
          old="""export async function getWorkerStatus(credential = '', tenant = DEFAULT_CLIENT_ID) {
  const id = sanitizeTenant(tenant);
  rememberCredential(credential, id);
  if (externalWorkerConfigured()) {"""
          new="""export async function getWorkerStatus(credential = '', tenant = DEFAULT_CLIENT_ID) {
  const id = sanitizeTenant(tenant);
  rememberCredential(credential, id);
  if (externalWorkerConfigured() && id === DEFAULT_CLIENT_ID) {"""
          if old not in s: raise SystemExit('getWorkerStatus pattern not found')
          s=s.replace(old,new,1)
          old="""    if (externalWorkerConfigured()) {
      const response = await fetchExternalWorker(internalPath, {"""
          new="""    if (externalWorkerConfigured() && tenant === DEFAULT_CLIENT_ID) {
      const response = await fetchExternalWorker(internalPath, {"""
          if old not in s: raise SystemExit('proxyWorker pattern not found')
          s=s.replace(old,new,1)
          old="""export async function sandboxDiagnostics(credential = '', tenant = DEFAULT_CLIENT_ID) {
  const id = sanitizeTenant(tenant);
  rememberCredential(credential, id);
  if (externalWorkerConfigured()) {"""
          new="""export async function sandboxDiagnostics(credential = '', tenant = DEFAULT_CLIENT_ID) {
  const id = sanitizeTenant(tenant);
  rememberCredential(credential, id);
  if (externalWorkerConfigured() && id === DEFAULT_CLIENT_ID) {"""
          if old not in s: raise SystemExit('sandboxDiagnostics pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit isolation patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/sandbox-runtime.js
          git commit -m "Isola novos clientes e preserva worker da America Guinchos"
          git push origin HEAD:main
