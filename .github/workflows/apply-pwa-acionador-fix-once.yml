name: Apply PWA Acionador Fix Once
on:
  push:
    branches: [pwa-acionador-fix-20260903]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pwa-acionador-fix-20260903
      - name: Patch branding endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/worker/[...path].js')
          s = p.read_text()
          old = "if (!['logo','app_icon','favicon'].includes(kind)) return res.status(400).json({ error: 'invalid_kind' });"
          new = "if (!['logo','app_icon','favicon','pwa_180','pwa_192','pwa_512'].includes(kind)) return res.status(400).json({ error: 'invalid_kind' });"
          assert old in s, 'asset kinds pattern not found'
          s = s.replace(old, new, 1)
          old = "id: '/', name: b.platform_name, short_name: b.short_name, description: b.pwa_description,"
          new = "id: '/', name: b.platform_name || 'Acionador.ai', short_name: b.short_name || b.platform_name || 'Acionador.ai', description: b.pwa_description,"
          assert old in s, 'manifest names pattern not found'
          s = s.replace(old, new, 1)
          old = "icons: [{ src: `/api/worker/branding?mode=asset&kind=app_icon&v=${encodeURIComponent(String(b.updated_at || ''))}`, sizes: 'any', purpose: 'any maskable' }],"
          new = "icons: [\n          { src: b.app_icon_192_url || b.app_icon_url, sizes: '192x192', type: 'image/png', purpose: 'any' },\n          { src: b.app_icon_512_url || b.app_icon_url, sizes: '512x512', type: 'image/png', purpose: 'any' },\n        ],"
          assert old in s, 'manifest icons pattern not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/apply-pwa-acionador-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/worker/'[...path].js' .github/workflows/apply-pwa-acionador-fix-once.yml
          git commit -m "Finaliza PWA Acionador.ai para iOS e Android"
          git push origin HEAD:pwa-acionador-fix-20260903
