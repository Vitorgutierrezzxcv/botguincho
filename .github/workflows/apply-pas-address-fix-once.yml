name: Apply PAS Address Fix Once
on:
  push:
    paths: ['.github/workflows/apply-pas-address-fix-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: |
          python tools/fix_pas_address_tmp.py
          node --check tools/vercel-whatsapp-worker.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/vercel-whatsapp-worker.mjs
          git commit -m 'Corrige campo PAS em endereços de seguradora' || true
          git push
      - name: Aguardar deploy
        run: sleep 30
      - name: Atualizar worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 3 --max-time 180 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Content-Type: application/json' \
            'https://botguincho.vercel.app/api/worker/reload?companyId=cliente-teste' -o /tmp/reload.json
          sleep 20
      - name: Validar Honda real
        run: |
          set -e
          curl -fsSL -X POST -H 'Content-Type: application/json' \
            --data '{"fromTracker":true,"to":"RUA JOSE AUGUSTO DE OLIVEIRA 175, BAIRRO: PETROPOLIS, CIDADE: BETIM, ESTADO: MG, PAS: BRASIL"}' \
            'https://botguincho.vercel.app/api/worker/route-test?companyId=cliente-teste' -o /tmp/honda.json
          curl -fsSL 'https://botguincho.vercel.app/api/worker/health?companyId=cliente-teste' -o /tmp/health.json
          jq -e '.ok == true and .route.minutes > 0 and .route.distanceKm > 0' /tmp/honda.json >/dev/null
          jq -e '.checks.whatsapp.ok == true and .checks.tracker.ok == true' /tmp/health.json >/dev/null
          node <<'NODE'
          const fs=require('fs'); const h=JSON.parse(fs.readFileSync('/tmp/honda.json')); const health=JSON.parse(fs.readFileSync('/tmp/health.json')); fs.mkdirSync('ops',{recursive:true}); fs.writeFileSync('ops/pas-address-fix-validation.json',JSON.stringify({checkedAt:new Date().toISOString(),honda:h,health:{status:health.status,whatsapp:health.checks?.whatsapp,tracker:health.checks?.tracker}},null,2));
          NODE
          git pull --rebase
          git add ops/pas-address-fix-validation.json
          git commit -m 'Valida ETA do endereço com PAS' || true
          git push
