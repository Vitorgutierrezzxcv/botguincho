name: Validate safe state detection once

on:
  push:
    branches:
      - fix/uf-acacias-20260831
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message || '', '[safe-state-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uf-acacias-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply safe state detector
        run: node tools/apply-safe-state-detection.mjs
      - name: Validate state parsing and regressions
        run: |
          node --check tools/address-state-detection.mjs
          node --check tools/vercel-whatsapp-worker.mjs
          node tools/test-address-state-detection.mjs
          node tools/test-ai-operational-fallback.mjs
          node tools/test-operating-hours.mjs
          node tools/test-cancellation-policy.mjs
          node tools/test-worked-time-policy.mjs
          node tools/test-driver-payroll.mjs
      - name: Commit validated fix
        run: |
          rm -f .github/workflows/validate-safe-state-detection-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/vercel-whatsapp-worker.mjs .github/workflows/validate-safe-state-detection-once.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "fix: evita Acacias ser interpretado como Acre [safe-state-applied]"
            git push origin HEAD:fix/uf-acacias-20260831
          fi
