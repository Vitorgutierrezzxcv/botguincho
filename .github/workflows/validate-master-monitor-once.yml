name: Validate Master Monitor Once
on:
  push:
    paths:
      - 'api/control/overview.js'
      - 'public/master.js'
      - 'public/master.html'
      - '.github/workflows/validate-master-monitor-once.yml'
  workflow_dispatch:
concurrency:
  group: validate-master-monitor-once
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe
        run: |
          node --check api/control/overview.js
          node --check public/master.js
          grep -q 'Central de empresas' public/master.html
          grep -q 'Chamados hoje' public/master.js
          grep -q '/api/control/overview' public/master.js
      - name: Aguardar deploy
        run: sleep 25
      - name: Validar produção existente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsS --retry 3 --retry-delay 5 https://botguincho.vercel.app/master.html | grep -q 'Central de empresas'
          for TRY in 1 2 3; do
            HEALTH=$(curl -fsS --retry 2 --retry-delay 3 -H "Authorization: Bearer $GH_TOKEN" 'https://botguincho.vercel.app/api/worker/health?companyId=cliente-teste') || true
            if echo "$HEALTH" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const j=JSON.parse(s);const c=j.checks||{};if(j.status==='operational'&&c.whatsapp?.ok&&c.tracker?.ok&&c.routes?.ok){console.log('Saúde operacional OK');process.exit(0)}}catch{}process.exit(1)})"; then
              echo 'MASTER_MONITOR_OPERATIONAL_OK'
              exit 0
            fi
            echo "Tentativa $TRY ainda não operacional; aguardando..."
            sleep 20
          done
          echo "$HEALTH"
          exit 1
