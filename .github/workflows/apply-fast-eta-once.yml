name: Apply fast ETA once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fast-eta-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch
        run: |
          set -euo pipefail
          python3 tools/apply-fast-eta-patch.py

      - name: Validar ETA e regressões
        run: |
          set -euo pipefail
          node --check tools/vercel-whatsapp-worker.mjs
          node --check tools/simple-operation.mjs
          node tools/test-fast-eta.mjs
          node tools/test-simple-operation.mjs
          node tools/test-operating-hours.mjs
          node tools/test-operational-knowledge.mjs
          node tools/test-cancellation-policy.mjs
          node tools/test-worked-time-policy.mjs
          node tools/test-driver-payroll.mjs

      - name: Commitar correção
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-fast-eta-once.yml tools/apply-fast-eta-patch.py
          git add tools/vercel-whatsapp-worker.mjs tools/simple-operation.mjs tools/test-fast-eta.mjs
          git commit -m "fix: acelera ETA e garante previsão nas cotações"
          git push origin main
