name: Apply Real Insurer Patterns Once
on:
  push:
    paths:
      - 'tools/apply_real_insurer_patterns_tmp.py'
      - '.github/workflows/apply-real-insurer-patterns-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python3 tools/apply_real_insurer_patterns_tmp.py
      - name: Validar JavaScript
        run: node --check tools/vercel-whatsapp-worker.mjs
      - name: Validar regras críticas
        run: |
          grep -q "Em grupos de assistência é comum" tools/vercel-whatsapp-worker.mjs
          grep -q "km totais" tools/vercel-whatsapp-worker.mjs
          grep -q "disponivel para remocao" tools/vercel-whatsapp-worker.mjs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/vercel-whatsapp-worker.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Adapta bot aos formatos reais das assistências'
          git push
