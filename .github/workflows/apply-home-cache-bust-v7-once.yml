name: Apply home cache bust v7 once
on:
  push:
    branches: [main]
    paths:
      - tools/apply-home-cache-bust-v7.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply cache bust
        run: python tools/apply-home-cache-bust-v7.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Força carregamento da nova home V7"
          git push origin main
