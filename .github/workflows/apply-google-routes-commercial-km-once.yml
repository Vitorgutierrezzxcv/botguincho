name: Apply Google Routes commercial KM once

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-google-routes-commercial-km.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Google Routes patch
        run: python tools/apply-google-routes-commercial-km.py
      - name: Validate worker syntax
        run: node --check tools/vercel-whatsapp-worker.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/vercel-whatsapp-worker.mjs
          git commit -m "Usa Google Routes como referência da quilometragem comercial"
          git push origin main
