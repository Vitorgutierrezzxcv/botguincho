name: Emergency WhatsApp Recover Once
on:
  push:
    paths:
      - '.github/workflows/emergency-whatsapp-recover-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Consultar estado atual
        id: before
        run: |
          set -e
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 \
            'https://botguincho.vercel.app/api/worker/health?companyId=cliente-teste' -o /tmp/before.json
          cat /tmp/before.json; echo
          WA_OK=$(jq -r '.checks.whatsapp.ok // false' /tmp/before.json)
          echo "wa_ok=$WA_OK" >> "$GITHUB_OUTPUT"

      - name: Reload seguro preservando sessão
        if: steps.before.outputs.wa_ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -sS -L --retry 3 --retry-all-errors --retry-delay 3 --max-time 180 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"companyId":"cliente-teste"}' \
            'https://botguincho.vercel.app/api/worker/reload?companyId=cliente-teste' \
            -o /tmp/reload.json -w 'HTTP %{http_code}\n'
          cat /tmp/reload.json; echo
          sleep 35

      - name: Capturar estado final
        id: final
        run: |
          set +e
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 --max-time 120 \
            'https://botguincho.vercel.app/api/worker/health?companyId=cliente-teste' -o /tmp/final.json
          HEALTH_RC=$?
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 \
            'https://botguincho.vercel.app/api/worker/status?companyId=cliente-teste' -o /tmp/status.json
          STATUS_RC=$?
          set -e
          mkdir -p ops
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}};
          const health=read('/tmp/final.json');
          const status=read('/tmp/status.json');
          const out={
            checkedAt:new Date().toISOString(),
            companyId:'cliente-teste',
            healthStatus:health?.status||'unreachable',
            whatsapp:{ok:health?.checks?.whatsapp?.ok===true,status:health?.checks?.whatsapp?.status||status?.whatsapp?.status||'unknown',qrRequired:Boolean(status?.whatsapp?.qrDataUrl),lastError:status?.whatsapp?.lastError||null},
            tracker:{ok:health?.checks?.tracker?.ok===true,status:health?.checks?.tracker?.status||'unknown',ageSeconds:health?.checks?.tracker?.ageSeconds??null,plate:health?.checks?.tracker?.plate||null},
            routes:{ok:health?.checks?.routes?.ok===true},
            groupsSelected:health?.groupsSelected??status?.groupsSelected??0,
            operational:Boolean(health?.checks?.whatsapp?.ok&&health?.checks?.tracker?.ok&&health?.checks?.routes?.ok)
          };
          fs.writeFileSync('ops/emergency-status.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE

      - name: Publicar relatório operacional
        run: |
          git config user.name 'botguincho-ops'
          git config user.email 'actions@users.noreply.github.com'
          git add ops/emergency-status.json
          git commit -m 'Atualiza relatório emergencial de produção' || exit 0
          git push

      - name: Exigir operação saudável
        run: |
          jq -e '.operational == true' ops/emergency-status.json >/dev/null
          echo 'EMERGENCY_RECOVERY_OK'
