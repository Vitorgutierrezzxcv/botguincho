name: Fix bare availability once

on:
  push:
    paths:
      - '.github/workflows/fix-bare-availability-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply isolated availability fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/vercel-whatsapp-worker.mjs')
          text = path.read_text(encoding='utf-8')

          marker = 'async function handleAvailabilityRuntime(msg, groupName, readableText, incomingLocation, context) {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('availability handler not found; refusing to change anything')

          next_handler = text.find('\nasync function ', start + len(marker))
          section_end = next_handler if next_handler >= 0 else len(text)
          section = text[start:section_end]
          if 'bareAvailabilityOnly' in section:
              raise SystemExit('fix already present; refusing duplicate change')

          anchor = '  const facts = context.facts;\n'
          relative = section.find(anchor)
          if relative < 0:
              raise SystemExit('facts anchor not found inside availability handler')
          insert_at = start + relative + len(anchor)

          addition = """  // DISPONIBILIDADE_PURA: uma pergunta sem dados de atendimento responde somente disponibilidade.
          // Nao cria previa comercial nem informa valor-base sem dados da solicitacao.
          const bareAvailabilityOnly = asksAvailability(readableText)
            && !facts?.origin
            && !facts?.destination
            && !facts?.vehicle
            && !facts?.vehicleType
            && !facts?.plate
            && !facts?.protocol
            && !extractLabeledField(readableText, 'Origem')
            && !extractLabeledField(readableText, 'Destino')
            && !enderecoEmTextoLivre(readableText);
          if (bareAvailabilityOnly) {
            await replyAndRemember(msg, groupName, readableText, 'Disponível ✅', {
              intent: 'availability',
              activeCount: capacity.activeCount,
              slotsAvailable: capacity.slotsAvailable,
              bareAvailabilityOnly: true,
            });
            return;
          }

          """

          text = text[:insert_at] + addition + text[insert_at:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate affected worker and existing regressions
        run: |
          node --check tools/vercel-whatsapp-worker.mjs
          node tools/test-route-address-latency.mjs
          node tools/test-protocol-call-matching.mjs
          node tools/test-close-summary-and-protocol-policy.mjs
          node tools/test-simple-operation.mjs
          node tools/test-driver-payroll.mjs
          grep -F "bareAvailabilityOnly" tools/vercel-whatsapp-worker.mjs
          grep -F "await replyAndRemember(msg, groupName, readableText, 'Disponível ✅'" tools/vercel-whatsapp-worker.mjs

      - name: Commit only worker change
        run: |
          rm -f .github/workflows/fix-bare-availability-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/vercel-whatsapp-worker.mjs .github/workflows/fix-bare-availability-once.yml
          git diff --cached --stat
          git commit -m 'Corrige resposta de disponibilidade sem dados'
          git push origin main
