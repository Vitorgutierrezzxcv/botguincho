name: WhatsApp Worker Keeper

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: botguincho-worker-keeper
  cancel-in-progress: true

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Aguardar deployment da Vercel
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO="${GITHUB_REPOSITORY}"
          SHA="${GITHUB_SHA}"
          for i in $(seq 1 40); do
            DEPLOYS=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/deployments?sha=$SHA")
            STATUS_URL=$(printf '%s' "$DEPLOYS" | jq -r '.[0].statuses_url // empty')
            if [ -n "$STATUS_URL" ]; then
              STATUSES=$(curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$STATUS_URL")
              STATE=$(printf '%s' "$STATUSES" | jq -r '.[0].state // empty')
              echo "Vercel state=$STATE"
              if [ "$STATE" = "success" ]; then sleep 5; exit 0; fi
              if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then exit 1; fi
            fi
            sleep 5
          done
          exit 1

      - name: Manter WhatsApp ativo
        env:
          GH_TOKEN: ${{ github.token }}
          URL: https://botguincho.vercel.app/api/worker/maintain
        run: |
          set -e
          for attempt in 1 2 3; do
            CODE=$(curl -sS -L --max-time 90 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/json" \
              -o /tmp/maintain.json \
              -w '%{http_code}' \
              "$URL" || true)
            echo "Tentativa $attempt: HTTP $CODE"
            cat /tmp/maintain.json 2>/dev/null || true
            echo
            if [ "$CODE" = "200" ]; then
              node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/maintain.json', 'utf8'));
          if (!x.ok) process.exit(1);
          console.log(`worker=${x.ready ? 'online' : 'iniciando'} whatsapp=${x.whatsappStatus} rotated=${Boolean(x.rotated)}`);
          NODE
              exit 0
            fi
            sleep 8
          done
          exit 1

      - name: Detectar frame quebrado e recuperar sessão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -sS -L --max-time 45 \
            -H "Accept: application/json" \
            https://botguincho.vercel.app/api/worker/diagnostics \
            -o /tmp/diag.json || true

          NEED_RELOAD=0
          if grep -qiE 'detached Frame|Attempted to use detached|Target closed|Session closed|Execution context was destroyed' /tmp/diag.json 2>/dev/null; then
            NEED_RELOAD=1
          fi

          if [ "$NEED_RELOAD" = "0" ]; then
            echo "Sessão do WhatsApp saudável; nenhum reload necessário."
            exit 0
          fi

          echo "Sessão degradada detectada. Reiniciando worker preservando login e grupos..."
          CODE=$(curl -sS -L --max-time 180 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/json" \
            -o /tmp/reload.json \
            -w '%{http_code}' \
            https://botguincho.vercel.app/api/worker/reload || true)
          cat /tmp/reload.json 2>/dev/null || true
          echo
          test "$CODE" = "200"
