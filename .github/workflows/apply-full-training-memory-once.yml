name: Apply full training memory once

on:
  push:
    branches: [main]
    paths:
      - 'ops/trigger-full-training-memory.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply full training memory patch
        run: node tools/apply-full-training-memory-v3.mjs
      - name: Validate runtime regressions
        run: |
          set -euo pipefail
          node --check tools/learning-engine.mjs
          node --check tools/vercel-whatsapp-worker.mjs
          node --check api/worker/'[...path].js'
          node --check app.js
          node --check public/app.js
          node tools/test-learning-patterns.mjs
          node tools/test-operational-knowledge.mjs
          node tools/test-cancellation-policy.mjs
          node tools/test-worked-time-policy.mjs
          node tools/test-driver-payroll.mjs
          node tools/test-whatsapp-recovery.mjs
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-full-training-memory-once.yml
          rm -f tools/apply-full-training-memory.mjs
          rm -f tools/apply-full-training-memory-v3.mjs
          git add -A
          git commit -m "feat: memória integral das conversas reais [full-training-memory-applied]"
          git push origin HEAD:main
