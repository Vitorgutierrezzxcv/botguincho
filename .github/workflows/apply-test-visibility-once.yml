name: Apply test visibility once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-test-visibility-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar
        run: python3 tools/apply-test-visibility.py
      - name: Validar
        run: |
          node --check tools/vercel-whatsapp-worker.mjs
          node --check test-mode-visibility.js
          npm install --no-audit --no-fund >/dev/null 2>&1
          npm run test:operational
          npm run test:cancellation
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-test-visibility-once.yml tools/apply-test-visibility.py
          git add tools/vercel-whatsapp-worker.mjs test-mode-visibility.js public/test-mode-visibility.js index.html public/index.html
          git commit -m "fix: mostra atendimentos de teste sem contaminar producao"
          git push origin main
