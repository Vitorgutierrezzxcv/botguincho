name: Fix new quote context once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-new-quote-context-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir classificação de ficha nova
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('tools/operational-knowledge.mjs')
          s = p.read_text()

          old = "if (!/\\b(protocolo|acionamento|webprestador|prestador)\\b/.test(value)) return false;"
          new = "if (!/\\b(protocolo|acionamento|webprestador)\\b/.test(value)) return false;"
          if s.count(old) != 1:
              raise SystemExit(f'formal protocol trigger: {s.count(old)} ocorrencias')
          s = s.replace(old, new, 1)

          anchor = "function hasOperationalContext(value = '') {"
          helper = "function hasStructuredServiceRequest(text = '') {\n  const value = norm(text);\n  const hasOrigin = /\\borigem\\s*[:=\\-]/.test(value);\n  const hasDestination = /\\bdestino\\s*[:=\\-]/.test(value);\n  const hasServiceOrVehicle = /\\bservico(?:\\s+selecionado)?\\b|\\breboque\\b|\\bguincho\\b|\\butilitario\\b|\\bveiculo\\b|\\bmodelo\\b|\\bplaca\\b|\\bmotivo\\b/.test(value);\n  return hasOrigin && hasDestination && hasServiceOrVehicle;\n}\n\n"
          if s.count(anchor) != 1:
              raise SystemExit(f'helper anchor: {s.count(anchor)} ocorrencias')
          s = s.replace(anchor, helper + anchor, 1)

          early_anchor = "if ((base === 'administrative_notice' || hasAdministrativeSignals(value)) && !hasOperationalContext(value)) return 'administrative_notice';\n\n  // RECONHECE_ATALHOS"
          early_replacement = "if ((base === 'administrative_notice' || hasAdministrativeSignals(value)) && !hasOperationalContext(value)) return 'administrative_notice';\n\n  // Uma ficha completa sem protocolo formal e uma nova cotacao, mesmo quando ja\n  // existe outra corrida ativa no grupo. Perguntas explicitas de disponibilidade\n  // continuam no fluxo availability, que tambem registra a cotacao no financeiro.\n  if (hasStructuredServiceRequest(text) && !hasFormalProtocol(text) && base !== 'availability' && base !== 'authorization' && base !== 'scheduled_dispatch' && base !== 'cancellation' && base !== 'pending_approval' && base !== 'closure') return 'quote';\n\n  // RECONHECE_ATALHOS"
          if s.count(early_anchor) != 1:
              raise SystemExit(f'early structured anchor: {s.count(early_anchor)} ocorrencias')
          s = s.replace(early_anchor, early_replacement, 1)
          p.write_text(s)

          t = Path('tools/test-operational-knowledge.mjs')
          ts = t.read_text()
          marker = "console.log('OPERATIONAL_KNOWLEDGE_REGRESSION_OK');"
          screenshot = "\n".join([
              "Bmw / X1 Sdrive 20i X-line 2.0 Tb Ac ... Motivo PANE MECANICA Obs. p/ prestador:",
              "É expressamente proibido que os prestadores autorizem que alguém venha dentro do veículo, em cima da prancha.",
              "",
              "APM BRASIL",
              "",
              "Serviço selecionado REBOQUE UTILITARIO",
              "Origem: AVENIDA PROFESSOR CLOVIS SALGADO, nº 1578, VALE, IGARAPE - MG",
              "ref. GARIMPA OUTLET",
              "Destino: AVENIDA BARAO HOMEM DE MELO, nº 3490, ESTORIL, BELO HORIZONTE - MG",
              "ref. OFICINA / MARLON RECEBE 3136589880 * MG POWER",
          ])
          regression = "const screenshotQuote = " + json.dumps(screenshot, ensure_ascii=False) + ";\nassert.equal(classifyRuntimeIntent(screenshotQuote, 'Tests guincho', { status: 'autorizado', origin: 'Rua antiga', destination: 'Oficina antiga' }), 'quote', 'Ficha completa nova nao pode ser anexada a corrida ativa');\nassert.equal(classifyRuntimeIntent('Protocolo definitivo: 8821', 'Tests guincho', { status: 'autorizado' }), 'protocol_update', 'Protocolo isolado continua atualizando a corrida ativa');\nassert.equal(classifyRuntimeIntent('PROTOCOLO: HZ-22\\nSERVIÇO: REBOQUE LEVE\\nORIGEM: Rua A, 10\\nDESTINO: Rua B, 20', 'Horizonte', { status: 'cotacao' }), 'formal_dispatch', 'Excecao formal da Horizonte deve continuar autorizando');\n\n"
          if ts.count(marker) != 1:
              raise SystemExit(f'test marker: {ts.count(marker)} ocorrencias')
          t.write_text(ts.replace(marker, regression + marker, 1))

          f = Path('tools/test-complete-operational-flows.mjs')
          fs = f.read_text()
          old_case = "['Origem: Rua A, 10. Destino: Rua B, 20. Veículo: Fiat Uno.', 'Solução Assistência', null, 'dispatch_details'],"
          new_case = "['Origem: Rua A, 10. Destino: Rua B, 20. Veículo: Fiat Uno.', 'Solução Assistência', null, 'quote'],"
          if fs.count(old_case) != 1:
              raise SystemExit(f'complete flow quote case: {fs.count(old_case)} ocorrencias')
          f.write_text(fs.replace(old_case, new_case, 1))
          PY

      - name: Rodar regressões
        run: |
          set -euo pipefail
          node --check tools/operational-knowledge.mjs
          node tools/test-operational-knowledge.mjs
          node tools/test-complete-operational-flows.mjs
          node tools/test-business-orchestration.mjs
          node tools/test-simple-operation.mjs
          node tools/test-cancellation-policy.mjs
          node tools/test-operating-hours.mjs

      - name: Commitar correção
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/operational-knowledge.mjs tools/test-operational-knowledge.mjs tools/test-complete-operational-flows.mjs
          git commit -m "fix: separa nova cotacao de protocolo ativo"
          git push origin main
