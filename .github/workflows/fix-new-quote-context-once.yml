name: Fix new quote context once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-new-quote-context-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir classificação de ficha nova
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/operational-knowledge.mjs')
          s = p.read_text()

          old = "if (!/\\b(protocolo|acionamento|webprestador|prestador)\\b/.test(value)) return false;"
          new = "if (!/\\b(protocolo|acionamento|webprestador)\\b/.test(value)) return false;"
          if s.count(old) != 1:
              raise SystemExit(f'formal protocol trigger: {s.count(old)} ocorrencias')
          s = s.replace(old, new, 1)

          anchor = "function hasOperationalContext(value = '') {"
          helper = r'''function hasStructuredServiceRequest(text = '') {
  const value = norm(text);
  const hasOrigin = /\borigem\s*[:=\-]/.test(value);
  const hasDestination = /\bdestino\s*[:=\-]/.test(value);
  const hasServiceOrVehicle = /\bservico(?:\s+selecionado)?\b|\breboque\b|\bguincho\b|\butilitario\b|\bveiculo\b|\bmodelo\b|\bplaca\b|\bmotivo\b/.test(value);
  return hasOrigin && hasDestination && hasServiceOrVehicle;
}

'''
          if s.count(anchor) != 1:
              raise SystemExit(f'helper anchor: {s.count(anchor)} ocorrencias')
          s = s.replace(anchor, helper + anchor, 1)

          old_protocol = "if (evidenceContext && /\\bprotocolo\\b/.test(value)) return 'protocol_update';"
          new_protocol = "if (evidenceContext && /\\bprotocolo\\b/.test(value) && !hasStructuredServiceRequest(text)) return 'protocol_update';"
          if s.count(old_protocol) != 1:
              raise SystemExit(f'protocol update guard: {s.count(old_protocol)} ocorrencias')
          s = s.replace(old_protocol, new_protocol, 1)

          anchor2 = "if (base === 'eta') return 'eta';\n\n  // Uma pergunta de disponibilidade continua sendo consulta mesmo que a ficha"
          replacement2 = "if (base === 'eta') return 'eta';\n\n  // Uma ficha completa de um novo servico e uma nova oportunidade, mesmo que exista\n  // outra corrida ativa no mesmo grupo. Isso evita que a segunda cotacao seja\n  // anexada ao protocolo da primeira corrida. Horizonte preserva a excecao de\n  // protocolo formal que pode autorizar.\n  if (hasStructuredServiceRequest(text) && !(profile.formalProtocolCanAuthorize && hasFormalProtocol(text))) return 'quote';\n\n  // Uma pergunta de disponibilidade continua sendo consulta mesmo que a ficha"
          if s.count(anchor2) != 1:
              raise SystemExit(f'structured request anchor: {s.count(anchor2)} ocorrencias')
          s = s.replace(anchor2, replacement2, 1)
          p.write_text(s)

          t = Path('tools/test-operational-knowledge.mjs')
          ts = t.read_text()
          marker = "console.log('OPERATIONAL_KNOWLEDGE_REGRESSION_OK');"
          regression = r'''const screenshotQuote = `Bmw / X1 Sdrive 20i X-line 2.0 Tb Ac ... Motivo PANE MECANICA Obs. p/ prestador:
É expressamente proibido que os prestadores autorizem que alguém venha dentro do veículo, em cima da prancha.

APM BRASIL

Serviço selecionado REBOQUE UTILITARIO
Origem: AVENIDA PROFESSOR CLOVIS SALGADO, nº 1578, VALE, IGARAPE - MG
ref. GARIMPA OUTLET
Destino: AVENIDA BARAO HOMEM DE MELO, nº 3490, ESTORIL, BELO HORIZONTE - MG
ref. OFICINA / MARLON RECEBE 3136589880 * MG POWER`;
assert.equal(classifyRuntimeIntent(screenshotQuote, 'Tests guincho', { status: 'autorizado', origin: 'Rua antiga', destination: 'Oficina antiga' }), 'quote', 'Ficha completa nova nao pode ser anexada a corrida ativa');
assert.equal(classifyRuntimeIntent('Protocolo definitivo: 8821', 'Tests guincho', { status: 'autorizado' }), 'protocol_update', 'Protocolo isolado continua atualizando a corrida ativa');
assert.equal(classifyRuntimeIntent('PROTOCOLO: HZ-22\nSERVIÇO: REBOQUE LEVE\nORIGEM: Rua A, 10\nDESTINO: Rua B, 20', 'Horizonte', { status: 'cotacao' }), 'formal_dispatch', 'Excecao formal da Horizonte deve continuar autorizando');

'''
          if ts.count(marker) != 1:
              raise SystemExit(f'test marker: {ts.count(marker)} ocorrencias')
          t.write_text(ts.replace(marker, regression + marker, 1))
          PY

      - name: Rodar regressões
        run: |
          set -euo pipefail
          node --check tools/operational-knowledge.mjs
          node tools/test-operational-knowledge.mjs
          node tools/test-complete-operational-flows.mjs
          node tools/test-business-orchestration.mjs
          node tools/test-simple-operation.mjs
          node tools/test-cancellation-policy.mjs
          node tools/test-operating-hours.mjs

      - name: Commitar correção
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/operational-knowledge.mjs tools/test-operational-knowledge.mjs
          git commit -m "fix: separa nova cotacao de protocolo ativo"
          git push origin main
