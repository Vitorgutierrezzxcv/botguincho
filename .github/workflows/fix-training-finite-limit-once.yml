name: Fix training finite limit once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-training-finite-limit-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Use finite WhatsApp history limit
        run: python3 -c "from pathlib import Path; p=Path('api/worker/[...path].js'); s=p.read_text(); old=\"body: JSON.stringify({ groupId, limit: 'all' }),\"; new=\"body: JSON.stringify({ groupId, limit: 10000 }),\"; assert old in s or new in s, 'target not found'; p.write_text(s.replace(old,new,1)) if old in s else None"
      - name: Validate syntax
        run: node --check 'api/worker/[...path].js'
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'api/worker/[...path].js'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Usa limite finito na importação de treinamento'
          git push origin HEAD:main
