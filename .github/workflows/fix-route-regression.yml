name: Fix Route Regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-route-regression.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patch regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/vercel-whatsapp-worker.mjs')
          s=p.read_text()
          bad="""    await setDispatchState(msg.from, {\n    lastEta: eta,\n    lastEtaAt: new Date().toISOString(),\n    ...(target.source === 'inline-address' || target.source === 'quoted-address'\n      ? { originAddress: target.targetAddress, originCoordinates: null, originUpdatedAt: new Date().toISOString() }\n      : {}),\n  });"""
          good="""    await setDispatchState(msg.from, { lastEta: eta, lastEtaAt: new Date().toISOString() });"""
          start=s.index('async function handleDispatch')
          end=s.index('function looksLikeAddressCandidate', start)
          segment=s[start:end]
          if bad not in segment:
              raise SystemExit('broken dispatch block not found')
          segment=segment.replace(bad,good,1)
          s=s[:start]+segment+s[end:]

          # Persist explicit address after successful distance calculation too.
          dstart=s.index('async function handleDistanceQuestion')
          dend=s.index('async function handleTrackerLocationQuestion', dstart)
          dseg=s[dstart:dend]
          old="  await setDispatchState(msg.from, { lastEta: eta, lastEtaAt: new Date().toISOString() });"
          new="""  await setDispatchState(msg.from, {\n    lastEta: eta,\n    lastEtaAt: new Date().toISOString(),\n    ...(target.source === 'inline-address' || target.source === 'quoted-address'\n      ? { originAddress: target.targetAddress, originCoordinates: null, originUpdatedAt: new Date().toISOString() }\n      : {}),\n  });"""
          if old in dseg:
              dseg=dseg.replace(old,new,1)
          s=s[:dstart]+dseg+s[dend:]

          # Photon supports default/de/en/fr; omit language so fallback actually works.
          s=s.replace("    url.searchParams.set('lang', 'pt');\n",'')
          p.write_text(s)
          PY
          node --check tools/vercel-whatsapp-worker.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tools/vercel-whatsapp-worker.mjs').read_text()
          a=s[s.index('async function handleDispatch'):s.index('function looksLikeAddressCandidate')]
          assert 'target.source' not in a
          print('dispatch regression check OK')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/vercel-whatsapp-worker.mjs
          git commit -m 'Corrige regressao do dispatch e Photon'
          git push
          echo "SOURCE_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -sS -L --max-time 180 -X POST -H "Authorization: Bearer $GH_TOKEN" -H "X-BotGuincho-Source-Ref: $SOURCE_REF" -H 'Content-Type: application/json' -o /tmp/reload.json -w '%{http_code}' https://botguincho.vercel.app/api/worker/reload)
          cat /tmp/reload.json
          test "$CODE" = "200"
          jq -e --arg ref "$SOURCE_REF" '.ok == true and .sourceRef == $ref and .whatsappStatus == "pronto" and .workerProcessCount == 1' /tmp/reload.json >/dev/null
      - name: Validate routes
        run: |
          set -e
          check() {
            BODY="$1"
            CODE=$(curl -sS -L --max-time 120 -X POST -H 'Content-Type: application/json' --data "$BODY" -o /tmp/r.json -w '%{http_code}' https://botguincho.vercel.app/api/worker/route-test)
            echo "HTTP $CODE"; cat /tmp/r.json; echo
            test "$CODE" = "200"
            jq -e '.ok == true and (.route.minutes|numbers) > 0 and (.route.distanceKm|numbers) > 0' /tmp/r.json >/dev/null
          }
          check "$(jq -nc --arg message $'Rua inspetor Jaime caldeira, brasileia, Betim Minas Gerais\nQual tempo de distância?' '{fromTracker:true,message:$message}')"
          check "$(jq -nc --arg quoted 'Rua inspetor Jaime caldeira, brasileia, Betim Minas Gerais' '{fromTracker:true,message:"Qual tempo de distância?",quotedText:$quoted}')"
          check "$(jq -nc --arg message 'Qual previsão de chegada? Avenida Paulista, 1000, Bela Vista, São Paulo - SP' '{fromTracker:true,message:$message}')"
          check '{"fromTracker":true,"message":"Qual previsão de chegada? 30130-010"}'
          check '{"fromTracker":true,"toLatitude":-19.9705,"toLongitude":-44.1982}'
      - name: Confirm invalid address does not masquerade as old ETA
        run: |
          CODE=$(curl -sS -L --max-time 120 -X POST -H 'Content-Type: application/json' --data "$(jq -nc --arg quoted 'Rua Mitu, número 15, Icaivera Betim, Minas Gerais Brasil' '{fromTracker:true,message:"Qual tempo de distância?",quotedText:$quoted}')" -o /tmp/bad.json -w '%{http_code}' https://botguincho.vercel.app/api/worker/route-test)
          cat /tmp/bad.json; echo
          test "$CODE" = "422" || test "$CODE" = "200"
          jq -e '.parsedTarget == "Rua Mitu, 15, Icaivera Betim, Minas Gerais Brasil"' /tmp/bad.json >/dev/null
