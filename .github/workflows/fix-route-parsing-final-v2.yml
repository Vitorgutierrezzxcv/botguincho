name: Fix Route Parsing Final V2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-route-parsing-final-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 tools/fix_route_parsing_final.py
          node --check tools/vercel-whatsapp-worker.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/vercel-whatsapp-worker.mjs
          git commit -m 'Corrige parser generico e fallbacks de endereco'
          git push
          echo "SOURCE_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Reload worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -sS -L --max-time 180 -X POST -H "Authorization: Bearer $GH_TOKEN" -H "X-BotGuincho-Source-Ref: $SOURCE_REF" -H 'Content-Type: application/json' -o /tmp/reload.json -w '%{http_code}' https://botguincho.vercel.app/api/worker/reload)
          cat /tmp/reload.json
          test "$CODE" = "200"
          jq -e --arg ref "$SOURCE_REF" '.ok == true and .sourceRef == $ref and .whatsappStatus == "pronto" and .workerProcessCount == 1' /tmp/reload.json >/dev/null
      - name: Test quoted and inline addresses
        run: |
          set -e
          test_case() {
            MESSAGE="$1"
            QUOTED="$2"
            BODY=$(jq -nc --arg message "$MESSAGE" --arg quoted "$QUOTED" '{fromTracker:true,message:$message,quotedText:$quoted}')
            CODE=$(curl -sS -L --max-time 120 -X POST -H 'Content-Type: application/json' --data "$BODY" -o /tmp/route.json -w '%{http_code}' https://botguincho.vercel.app/api/worker/route-test)
            cat /tmp/route.json
            test "$CODE" = "200"
            jq -e '.ok == true and (.route.minutes|numbers) > 0 and (.route.distanceKm|numbers) > 0 and (.parsedTarget|length) > 3' /tmp/route.json >/dev/null
            ! jq -r '.parsedTarget' /tmp/route.json | grep -Eqi 'qual.*tempo|previs[aã]o.*chegada'
          }
          test_case $'Rua inspetor Jaime caldeira, brasileia, Betim Minas Gerais\nQual tempo de distância?' ''
          test_case 'Qual tempo de distância?' 'Rua inspetor Jaime caldeira, brasileia, Betim Minas Gerais'
          test_case 'Qual tempo de distância?' 'Rua Mitu, número 15, Icaivera Betim, Minas Gerais Brasil'
          test_case 'Qual previsão de chegada? Avenida Paulista, 1000, Bela Vista, São Paulo - SP' ''
      - name: Test native coordinates
        run: |
          CODE=$(curl -sS -L --max-time 90 -X POST -H 'Content-Type: application/json' -d '{"fromTracker":true,"toLatitude":-19.9705,"toLongitude":-44.1982}' -o /tmp/coords.json -w '%{http_code}' https://botguincho.vercel.app/api/worker/route-test)
          cat /tmp/coords.json
          test "$CODE" = "200"
          jq -e '.ok == true and (.route.minutes|numbers) > 0' /tmp/coords.json >/dev/null
