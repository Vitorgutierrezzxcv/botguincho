name: Apply training runtime and state cleanup once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-training-runtime-and-state-cleanup-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar índice determinístico do treinamento histórico
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          export_dir = root / 'training' / 'exports'
          entries = []
          groups = []

          def norm(v):
              import unicodedata
              v = unicodedata.normalize('NFD', str(v or ''))
              v = ''.join(ch for ch in v if unicodedata.category(ch) != 'Mn').lower()
              return re.sub(r'\s+', ' ', re.sub(r'[^a-z0-9]+', ' ', v)).strip()

          def intent_for(category, phrase):
              k = norm(category)
              p = norm(phrase)
              if 'avail' in k or 'disponib' in k:
                  return 'availability'
              if 'author' in k or 'autoriz' in k:
                  return 'authorization'
              if 'cancel' in k or 'abort' in k or 'desist' in k:
                  return 'cancellation'
              if 'completion' in k or 'closure' in k or 'closing' in k or 'fech' in k:
                  return 'closure'
              if 'schedul' in k or 'agend' in k:
                  return 'scheduled_dispatch'
              if 'evidence' in k or 'evidenc' in k:
                  return 'evidence'
              if 'protocol' in k:
                  return 'protocol_received'
              if 'dispatch' in k or 'acion' in k:
                  return 'dispatch_details'
              if 'quote' in k or 'eta' in k or 'previa' in k:
                  if re.search(r'\b(valor|preco|saida|km|quilometragem|cotacao)\b', p):
                      return 'quote'
                  return 'eta'
              return None

          for file in sorted(export_dir.glob('*.json')):
              data = json.loads(file.read_text())
              group = str(data.get('group') or file.stem)
              count = int(data.get('messageCount') or 0)
              groups.append({'group': group, 'messageCount': count, 'sourceFile': file.name})
              patterns = data.get('conversationPatterns') or {}
              for category, values in patterns.items():
                  if not isinstance(values, list):
                      continue
                  for phrase in values:
                      phrase = str(phrase or '').strip()
                      intent = intent_for(category, phrase)
                      if not phrase or not intent or len(phrase) > 240:
                          continue
                      entries.append({
                          'group': group,
                          'messageCount': count,
                          'category': str(category),
                          'intent': intent,
                          'phrase': phrase,
                      })

          module = f'''// Gerado automaticamente a partir de training/exports/*.json.\n// Não editar manualmente; o corpus é anonimizado e serve apenas para classificação lexical.\nconst ENTRIES = {json.dumps(entries, ensure_ascii=False, separators=(',', ':'))};\nconst GROUPS = {json.dumps(groups, ensure_ascii=False, separators=(',', ':'))};\n\nfunction norm(value = '') {{\n  return String(value || '')\n    .normalize('NFD').replace(/[\\u0300-\\u036f]/g, '')\n    .toLowerCase()\n    .replace(/[^a-z0-9]+/g, ' ')\n    .replace(/\\s+/g, ' ')\n    .trim();\n}}\n\nconst STOP = new Set(['a','o','as','os','de','da','do','das','dos','e','em','no','na','nos','nas','um','uma','para','pra','pro','por','com','que','esse','essa','isso','ai','ae','pessoal','amigo']);\nfunction tokens(value) {{\n  return norm(value).split(' ').filter((token) => token.length > 1 && !STOP.has(token));\n}}\n\nfunction tokenCoverage(a, b) {{\n  const aa = new Set(tokens(a)), bb = new Set(tokens(b));\n  if (!aa.size || !bb.size) return 0;\n  let hit = 0;\n  for (const token of aa) if (bb.has(token)) hit += 1;\n  return hit / Math.min(aa.size, bb.size);\n}}\n\nfunction bigrams(value) {{\n  const v = norm(value).replace(/ /g, '_');\n  if (v.length < 2) return [v];\n  const out = [];\n  for (let i = 0; i < v.length - 1; i += 1) out.push(v.slice(i, i + 2));\n  return out;\n}}\n\nfunction dice(a, b) {{\n  const aa = bigrams(a), bb = bigrams(b);\n  if (!aa.length || !bb.length) return 0;\n  const counts = new Map();\n  for (const item of aa) counts.set(item, (counts.get(item) || 0) + 1);\n  let hit = 0;\n  for (const item of bb) {{\n    const left = counts.get(item) || 0;\n    if (left > 0) {{ hit += 1; counts.set(item, left - 1); }}\n  }}\n  return (2 * hit) / (aa.length + bb.length);\n}}\n\nfunction groupMatchScore(current, trained) {{\n  const a = norm(current), b = norm(trained);\n  if (!a || !b) return 0;\n  if (a === b) return 1;\n  return Math.max(tokenCoverage(a, b), dice(a, b));\n}}\n\nexport function matchHistoricalTrainingIntent(text = '', groupName = '') {{\n  const value = norm(text);\n  if (!value || value.length < 2) return null;\n  let best = null;\n  for (const entry of ENTRIES) {{\n    const phrase = norm(entry.phrase);\n    if (!phrase) continue;\n    let score = 0;\n    if (value === phrase) score = 1;\n    else if (Math.min(value.length, phrase.length) >= 4 && (value.includes(phrase) || phrase.includes(value))) score = 0.90;\n    else score = 0.58 * dice(value, phrase) + 0.42 * tokenCoverage(value, phrase);\n    const sameGroup = groupMatchScore(groupName, entry.group);\n    if (sameGroup >= 0.72) score = Math.min(1, score + 0.06);\n    if (!best || score > best.score) best = {{ ...entry, score }};\n  }}\n  return best && best.score >= 0.72 ? best : null;\n}}\n\nexport function historicalTrainingStats() {{\n  return {{\n    groups: GROUPS.length,\n    cataloguedMessages: GROUPS.reduce((sum, group) => sum + Number(group.messageCount || 0), 0),\n    lexicalPatterns: ENTRIES.length,\n    mode: 'deterministic_retrieval',\n  }};\n}}\n'''
          (root / 'tools' / 'training-runtime-index.mjs').write_text(module)
          print(f'Gerado: {len(groups)} grupos, {sum(g["messageCount"] for g in groups)} mensagens catalogadas, {len(entries)} padrões lexicais')
          PY

      - name: Integrar treinamento e higienizar estado persistente
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 trecho, encontrado {count}')
              p.write_text(s.replace(old, new, 1))

          # O classificador só usa o histórico como fallback. Regras críticas continuam soberanas.
          rep(
            'tools/operational-knowledge.mjs',
            "import { inferLearningIntent } from './learning-engine.mjs';\n",
            "import { inferLearningIntent } from './learning-engine.mjs';\nimport { matchHistoricalTrainingIntent } from './training-runtime-index.mjs';\n",
            'import training index')

          rep(
            'tools/operational-knowledge.mjs',
            "  if (base === 'dispatch') return hasIncompleteDispatch(value) ? 'incomplete_dispatch' : 'dispatch_details';\n  if (hasIncompleteDispatch(value)) return 'incomplete_dispatch';\n  return base;\n}",
            "  if (base === 'dispatch') return hasIncompleteDispatch(value) ? 'incomplete_dispatch' : 'dispatch_details';\n  if (hasIncompleteDispatch(value)) return 'incomplete_dispatch';\n\n  // O histórico de 16 mil+ mensagens entra como recuperação lexical apenas quando\n  // as regras determinísticas normais não reconheceram a frase. Assim o treinamento\n  // melhora linguagem/variações sem poder sobrescrever autorização, preço ou estado.\n  if (!base || base === 'other') {\n    const trained = matchHistoricalTrainingIntent(text, groupName);\n    if (trained?.intent) {\n      const requiresActiveCall = new Set(['closure', 'evidence', 'departure', 'waiting_customer', 'loaded', 'destination_arrival']);\n      if (!requiresActiveCall.has(trained.intent) || activeService) return trained.intent;\n    }\n  }\n  return base;\n}",
            'historical fallback')

          rep(
            'tools/vercel-whatsapp-worker.mjs',
            "import { trackerAgeSeconds } from './tracker-freshness.mjs';\n",
            "import { trackerAgeSeconds } from './tracker-freshness.mjs';\nimport { historicalTrainingStats } from './training-runtime-index.mjs';\n",
            'worker training stats import')

          old_management = """async function getManagement() {
  const state = normalizeManagement(await readJson(managementFile, DEFAULT_MANAGEMENT));
  const mainTruck = (state.fleet || []).find((item) => item?.id === 'fleet-gsw0h17' || String(item?.plate || '').toUpperCase() === 'GSW0H17');
  if (mainTruck && !String(mainTruck.driver || '').trim()) {
    mainTruck.driver = 'Mauro';
    return saveManagement(state);
  }
  return state;
}"""
          new_management = """async function getManagement() {
  const state = normalizeManagement(await readJson(managementFile, DEFAULT_MANAGEMENT));
  const allowed = await getAllowedGroupIds().catch(() => new Set());
  const operationalGroup = (groupId = '', groupName = '') => {
    if (!groupId) return true;
    if (allowed.has(groupId)) return true;
    return resolveGroupProfile(groupName).key !== 'generic';
  };
  let dirty = false;

  const beforeCalls = state.calls.length;
  state.calls = state.calls.filter((call) => operationalGroup(call?.sourceGroupId || '', call?.insurer || call?.client || ''));
  if (state.calls.length !== beforeCalls) dirty = true;

  for (const call of state.calls) {
    if ((call?.driverFleetId === 'fleet-gsw0h17' || call?.driverId === 'fleet-gsw0h17') && (!call?.driverName || call.driverName === 'Motorista principal')) {
      call.driverName = 'Mauro';
      dirty = true;
    }
  }

  const beforeProfiles = state.billingProfiles.length;
  state.billingProfiles = state.billingProfiles.filter((profile) => operationalGroup(profile?.groupId || '', profile?.groupName || ''));
  if (state.billingProfiles.length !== beforeProfiles) dirty = true;

  const beforeFinance = state.finance.length;
  state.finance = state.finance.filter((entry) => operationalGroup(entry?.groupId || '', entry?.insurer || entry?.client || ''));
  if (state.finance.length !== beforeFinance) dirty = true;

  const beforeBatches = state.billingBatches.length;
  state.billingBatches = state.billingBatches.filter((batch) => operationalGroup(batch?.groupId || '', batch?.groupName || batch?.insurer || ''));
  if (state.billingBatches.length !== beforeBatches) dirty = true;

  const mainTruck = (state.fleet || []).find((item) => item?.id === 'fleet-gsw0h17' || String(item?.plate || '').toUpperCase() === 'GSW0H17');
  if (mainTruck && !String(mainTruck.driver || '').trim()) {
    mainTruck.driver = 'Mauro';
    dirty = true;
  }
  return dirty ? saveManagement(state) : state;
}"""
          rep('tools/vercel-whatsapp-worker.mjs', old_management, new_management, 'management hygiene')

          # Esconde grupos pessoais no seletor sem impedir grupos operacionais novos.
          marker = """async function savedGroupsList() {
  const previousRegistry = await getRegistry();
  const allowed = await getAllowedGroupIds();
  return Object.values(previousRegistry)
    .map((group) => ({ ...group, selected: allowed.has(group.id) }))
    .sort((a, b) => String(a.name).localeCompare(String(b.name), 'pt-BR'));
}"""
          replacement = """function isOperationalGroupCandidate(group = {}, allowed = new Set()) {
  if (allowed.has(group?.id)) return true;
  const name = String(group?.name || '');
  if (isTestGroupName(name) || resolveGroupProfile(name).key !== 'generic') return true;
  const value = normalizeForIntent(`${name} ${group?.description || ''}`);
  return /\\b(guincho|reboque|assistencia|socorro|prestador|prancha|transportes? de veiculos?)\\b/.test(value);
}

async function savedGroupsList() {
  const previousRegistry = await getRegistry();
  const allowed = await getAllowedGroupIds();
  return Object.values(previousRegistry)
    .filter((group) => isOperationalGroupCandidate(group, allowed))
    .map((group) => ({ ...group, selected: allowed.has(group.id) }))
    .sort((a, b) => String(a.name).localeCompare(String(b.name), 'pt-BR'));
}"""
          rep('tools/vercel-whatsapp-worker.mjs', marker, replacement, 'saved groups filter')

          old_live = """      return [...discovered.values()]
        .map((group) => ({ ...group, selected: validAllowed.includes(group.id) }))
        .sort((a, b) => String(a.name).localeCompare(String(b.name), 'pt-BR'));"""
          new_live = """      const effectiveAllowed = new Set(validAllowed);
      return [...discovered.values()]
        .filter((group) => isOperationalGroupCandidate(group, effectiveAllowed))
        .map((group) => ({ ...group, selected: effectiveAllowed.has(group.id) }))
        .sort((a, b) => String(a.name).localeCompare(String(b.name), 'pt-BR'));"""
          rep('tools/vercel-whatsapp-worker.mjs', old_live, new_live, 'live groups filter')

          old_fallback = """  return Object.values(previousRegistry)
    .map((group) => ({ ...group, selected: allowed.has(group.id) }))
    .sort((a, b) => String(a.name).localeCompare(String(b.name), 'pt-BR'));
}"""
          new_fallback = """  return Object.values(previousRegistry)
    .filter((group) => isOperationalGroupCandidate(group, allowed))
    .map((group) => ({ ...group, selected: allowed.has(group.id) }))
    .sort((a, b) => String(a.name).localeCompare(String(b.name), 'pt-BR'));
}"""
          # Há dois trechos semelhantes; após substituir savedGroupsList acima, resta exatamente o fallback.
          rep('tools/vercel-whatsapp-worker.mjs', old_fallback, new_fallback, 'fallback groups filter')

          old_summary = "return res.json({ ok: true, groupCount: groups.length, exampleCount: groups.reduce((sum, group) => sum + group.examples, 0), groups });"
          new_summary = "return res.json({ ok: true, groupCount: groups.length, exampleCount: groups.reduce((sum, group) => sum + group.examples, 0), historicalTraining: historicalTrainingStats(), groups });"
          rep('tools/vercel-whatsapp-worker.mjs', old_summary, new_summary, 'learning summary training stats')
          PY

      - name: Testar treinamento e regressões
        run: |
          set -euo pipefail
          cat > tools/test-training-runtime-index.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { matchHistoricalTrainingIntent, historicalTrainingStats } from './training-runtime-index.mjs';

          const stats = historicalTrainingStats();
          assert.equal(stats.groups, 10);
          assert.equal(stats.cataloguedMessages, 16308);
          assert.ok(stats.lexicalPatterns >= 30);
          assert.equal(matchHistoricalTrainingIntent('Conseguem esse?', 'América Guincho X Plus Assistência')?.intent, 'availability');
          assert.equal(matchHistoricalTrainingIntent('Seguir?', 'América Guincho X Plus Assistência')?.intent, 'authorization');
          assert.equal(matchHistoricalTrainingIntent('PREVIA?', 'América Guincho X Plus Assistência')?.intent, 'eta');
          assert.equal(matchHistoricalTrainingIntent('pessoal pode deixar, conseguiu resolver lá', 'América Guincho X Plus Assistência')?.intent, 'cancellation');
          assert.equal(matchHistoricalTrainingIntent('confere fechamento?', 'América Guincho X Plus Assistência')?.intent, 'closure');
          assert.equal(matchHistoricalTrainingIntent('reunião de marketing amanhã', 'América Guincho X Plus Assistência'), null);
          console.log('TRAINING_RUNTIME_INDEX_OK', stats);
          EOF

          node --check tools/training-runtime-index.mjs
          node --check tools/operational-knowledge.mjs
          node --check tools/vercel-whatsapp-worker.mjs
          node tools/test-training-runtime-index.mjs
          node tools/test-learning-patterns.mjs
          node tools/test-operational-knowledge.mjs
          node tools/test-cancellation-policy.mjs
          node tools/test-worked-time-policy.mjs
          node tools/test-driver-payroll.mjs
          node tools/test-simple-operation.mjs

      - name: Commitar runtime treinado
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/training-runtime-index.mjs tools/test-training-runtime-index.mjs tools/operational-knowledge.mjs tools/vercel-whatsapp-worker.mjs
          git commit -m "fix: usa treinamento histórico no runtime e limpa estado legado"
          git push origin main
