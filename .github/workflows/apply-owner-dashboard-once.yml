psis}.owner-row-side{text-align:right;display:flex;align-items:flex-end;flex-direction:column;gap:7px}.owner-tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800;white-space:nowrap;color:#c8d2de;background:rgba(255,255,255,.035)}.owner-tag.won{color:#74dfb7;border-color:rgba(73,211,163,.28);background:rgba(73,211,163,.08)}.owner-tag.lost{color:#ff8b8b;border-color:rgba(255,101,101,.28);background:rgba(255,101,101,.08)}.owner-tag.open{color:#ffd579;border-color:rgba(255,195,68,.25);background:rgba(255,195,68,.07)}.owner-tag.source{color:#8dbbff;border-color:rgba(94,156,255,.26);background:rgba(94,156,255,.08)}.owner-pay-total{border:1px solid var(--line);background:rgba(94,156,255,.06);border-radius:14px;padding:15px;margin-bottom:8px}.owner-pay-total span{display:block;color:var(--muted);font-size:12px}.owner-pay-total strong{display:block;font-size:27px;margin-top:5px}.owner-pending{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--line)}.owner-pending:last-child{border-bottom:0}.owner-pending>strong{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.05);display:grid;place-items:center}.owner-pending>span:not(.owner-tag){font-size:13px}.owner-table th{white-space:nowrap}.owner-table td{vertical-align:middle}.owner-source-line{font-size:11px;color:var(--muted)}.owner-alert{font-size:11px;color:#ff8b8b;font-weight:800}.owner-mini-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.owner-mini-kpis>div{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.018)}.owner-mini-kpis span{display:block;font-size:12px;color:var(--muted);font-weight:700}.owner-mini-kpis b{display:block;font-size:21px;margin-top:5px}.owner-filterbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.owner-message-inline{color:#9da9b5;font-size:12px}.owner-driver-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.owner-driver-grid>div{border:1px solid var(--line);border-radius:12px;padding:13px}.owner-driver-grid span{display:block;color:var(--muted);font-size:12px}.owner-driver-grid b{display:block;margin-top:5px}.owner-driver-grid .total{background:rgba(94,156,255,.07);border-color:rgba(94,156,255,.25)}.owner-switch{padding:15px 0}.owner-switch .muted{max-width:590px;margin-top:4px}.owner-finance-overview,.owner-calls-overview{margin-bottom:16px}.owner-driver-detail{margin-bottom:16px}
          @media(max-width:1180px){.owner-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.owner-grid{grid-template-columns:1fr}.owner-mini-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.owner-driver-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:760px){.owner-toolbar{flex-direction:column}.owner-actions{width:100%;justify-content:flex-start}.owner-actions .btn,.owner-period{flex:1 1 auto}.owner-kpis{grid-template-columns:1fr 1fr}.owner-kpi{min-height:100px;padding:13px}.owner-kpi strong{font-size:21px}.owner-mini-kpis{grid-template-columns:1fr 1fr}.owner-driver-grid{grid-template-columns:1fr 1fr}.owner-row{align-items:flex-start}.owner-row-side{min-width:90px}.owner-route,.owner-message{white-space:normal}.owner-table{min-width:760px}}
          @media(max-width:480px){.owner-kpis{grid-template-columns:1fr}.owner-mini-kpis,.owner-driver-grid{grid-template-columns:1fr}.owner-actions>*{width:100%}}
