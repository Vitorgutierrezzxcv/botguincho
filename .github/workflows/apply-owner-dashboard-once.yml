          cp owner-dashboard.js public/owner-dashboard.js
          cp owner-dashboard.css public/owner-dashboard.css

          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html','public/index.html']:
              p=Path(name)
              text=p.read_text()
              if '/owner-dashboard.css' not in text:
                  text=text.replace('</head>','<link rel="stylesheet" href="/owner-dashboard.css"></head>')
              if '/owner-dashboard.js' not in text:
                  text=text.replace('<script src="/app.js" defer></script>','<script src="/app.js" defer></script><script src="/owner-dashboard.js" defer></script>')
              p.write_text(text)
          PY

      - name: Validate dashboard
        run: |
          node --check owner-dashboard.js
          node --check public/owner-dashboard.js
          grep -q '/owner-dashboard.js' index.html
          grep -q '/owner-dashboard.css' index.html
          grep -q '/owner-dashboard.js' public/index.html

      - name: Commit final owner experience
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-owner-dashboard-once.yml
          git add owner-dashboard.js owner-dashboard.css public/owner-dashboard.js public/owner-dashboard.css index.html public/index.html
