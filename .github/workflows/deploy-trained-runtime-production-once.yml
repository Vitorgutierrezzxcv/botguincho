name: Deploy trained runtime to production

on:
  push:
    branches: [main]
    paths:
      - 'ops/trigger-trained-runtime-deploy.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BASE: https://botguincho.vercel.app
      COMPANY: cliente-teste
      SOURCE_REF: 9fe60276de673f08d8cb40cd6d7c0552d5519701
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight production health
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 "$BASE/api/worker/health?companyId=$COMPANY" -o /tmp/pre-health.json
          curl -fsS --retry 3 --retry-delay 2 "$BASE/api/worker/status?companyId=$COMPANY" -o /tmp/pre-status.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/pre-health.json'))
          s=json.load(open('/tmp/pre-status.json'))
          checks=h.get('checks',{})
          assert checks.get('tracker',{}).get('ok') is True, f"Tracker não está saudável: {checks.get('tracker')}"
          assert checks.get('routes',{}).get('ok') is True, f"Rotas não estão saudáveis: {checks.get('routes')}"
          assert int(h.get('groupsSelected') or 0) >= 1, f"Nenhum grupo autorizado: {h.get('groupsSelected')}"
          whatsapp=s.get('whatsapp',{})
          assert not whatsapp.get('qrDataUrl'), 'QR ativo antes do deploy; abortando'
          assert whatsapp.get('status') in ('pronto','iniciando','erro'), f"Status WhatsApp não recuperável: {whatsapp}"
          print('PREFLIGHT_OK', whatsapp.get('status'))
          PY

      - name: Reload persistent worker safely
        run: |
          set -euo pipefail
          curl -fsS --max-time 180 --retry 2 --retry-delay 3 \
            -X POST "$BASE/api/worker/reload?companyId=$COMPANY" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "x-botguincho-company-id: $COMPANY" \
            -H "x-botguincho-source-ref: $SOURCE_REF" \
            -H 'content-type: application/json' \
            -d '{}' -o /tmp/reload.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/reload.json'))
          assert d.get('ok') is True, d
          assert d.get('whatsappStatus') == 'pronto', f"WhatsApp após reload: {d.get('whatsappStatus')}"
          assert d.get('workerProcessCount') == 1, f"Workers: {d.get('workerProcessCount')}"
          assert d.get('sessionPreserved') is True, 'Sessão não foi preservada'
          states=str(d.get('sourceState',''))
          for f in ['vercel-whatsapp-worker.mjs','learning-engine.mjs','operational-knowledge.mjs','cancellation-policy.mjs','worked-time-policy.mjs','driver-payroll.mjs','historical-spreadsheet-import.mjs','test-center.mjs']:
              assert f in states, f"Arquivo de runtime não sincronizado: {f}"
          print('RELOAD_OK')
          PY

      - name: Wait for stable post-reload state
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 15 "$BASE/api/worker/health?companyId=$COMPANY" -o /tmp/post-health.json && \
               curl -fsS --max-time 15 "$BASE/api/worker/status?companyId=$COMPANY" -o /tmp/post-status.json; then
              if python3 - <<'PY'
          import json,sys
          h=json.load(open('/tmp/post-health.json'))
          s=json.load(open('/tmp/post-status.json'))
          c=h.get('checks',{})
          ok=(c.get('whatsapp',{}).get('ok') is True and c.get('tracker',{}).get('ok') is True and c.get('routes',{}).get('ok') is True and s.get('whatsapp',{}).get('status')=='pronto' and not s.get('whatsapp',{}).get('qrDataUrl'))
          sys.exit(0 if ok else 1)
          PY
              then break; fi
            fi
            sleep 3
          done
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/post-health.json'))
          s=json.load(open('/tmp/post-status.json'))
          c=h.get('checks',{})
          assert c.get('whatsapp',{}).get('ok') is True, c.get('whatsapp')
          assert c.get('tracker',{}).get('ok') is True, c.get('tracker')
          assert c.get('routes',{}).get('ok') is True, c.get('routes')
          assert s.get('whatsapp',{}).get('status') == 'pronto', s.get('whatsapp')
          assert not s.get('whatsapp',{}).get('qrDataUrl'), 'QR apareceu depois do reload'
          assert int(h.get('groupsSelected') or 0) >= 1
          print('POST_HEALTH_OK')
          PY

      - name: Validate learning endpoints and authorized groups
        run: |
          set -euo pipefail
          curl -fsS "$BASE/api/worker/groups?companyId=$COMPANY" -o /tmp/groups.json
          curl -fsS "$BASE/api/worker/group-knowledge?companyId=$COMPANY" -o /tmp/knowledge.json
          curl -fsS "$BASE/api/worker/management?companyId=$COMPANY" -o /tmp/management.json
          curl -fsS "$BASE/api/worker/billing?companyId=$COMPANY" -o /tmp/billing.json
          curl -fsS "$BASE/api/worker/test-center?companyId=$COMPANY" -o /tmp/test-center.json
          python3 - <<'PY'
          import json
          groups=json.load(open('/tmp/groups.json')).get('groups',[])
          selected=[g for g in groups if g.get('selected')]
          assert selected, 'Nenhum grupo selecionado após reload'
          knowledge=json.load(open('/tmp/knowledge.json'))
          assert knowledge.get('ok') is True, knowledge
          management=json.load(open('/tmp/management.json'))
          assert management.get('ok') is True, management
          billing=json.load(open('/tmp/billing.json'))
          assert billing.get('ok') is True, billing
          rules=billing.get('driverRules',{})
          assert rules.get('paymentDay') == 20, rules
          assert rules.get('baseKmLimit') == 50 and rules.get('basePay') == 40, rules
          assert abs(float(rules.get('excessKmRate') or 0)-0.70) < 0.001, rules
          assert rules.get('workedTimeBelongsToDriver') is True, rules
          assert isinstance(billing.get('insurerSummaries'),list), billing
          assert isinstance(billing.get('historicalImports'),list), billing
          tests=json.load(open('/tmp/test-center.json'))
          assert tests.get('ok') is True and len(tests.get('scenarios',[])) >= 15, tests
          assert tests.get('simulator',{}).get('status') in ('desconectado','pronto','qr','iniciando','autenticado'), tests
          print('LEARNING_ENDPOINTS_OK', [g.get('name') for g in selected])
          PY

      - name: Write sanitized validation report
        run: |
          python3 - <<'PY'
          import json,datetime
          h=json.load(open('/tmp/post-health.json'))
          s=json.load(open('/tmp/post-status.json'))
          r=json.load(open('/tmp/reload.json'))
          g=json.load(open('/tmp/groups.json')).get('groups',[])
          k=json.load(open('/tmp/knowledge.json')).get('groups',[])
          b=json.load(open('/tmp/billing.json'))
          selected=[x for x in g if x.get('selected')]
          report={
            'validatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'sourceRef': '9fe60276de673f08d8cb40cd6d7c0552d5519701',
            'companyId': 'cliente-teste',
            'workerProcessCount': r.get('workerProcessCount'),
            'sessionPreserved': r.get('sessionPreserved'),
            'whatsapp': {'status': s.get('whatsapp',{}).get('status'), 'qrRequired': bool(s.get('whatsapp',{}).get('qrDataUrl'))},
            'tracker': {'ok': h.get('checks',{}).get('tracker',{}).get('ok'), 'ageSeconds': h.get('checks',{}).get('tracker',{}).get('ageSeconds'), 'plate': h.get('checks',{}).get('tracker',{}).get('plate')},
            'routes': {'ok': h.get('checks',{}).get('routes',{}).get('ok')},
            'groupsSelected': len(selected),
            'selectedGroupNames': [x.get('name') for x in selected],
            'knowledgeGroups': len(k),
            'insurerSummaries': len(b.get('insurerSummaries',[])),
            'driverPayrolls': len(b.get('driverPayrolls',[])),
            'driverRulesValidated': True,
            'historicalImports': len(b.get('historicalImports',[])),
            'runtimeFilesSynced': ['vercel-whatsapp-worker.mjs','learning-engine.mjs','operational-knowledge.mjs','cancellation-policy.mjs','worked-time-policy.mjs','driver-payroll.mjs','historical-spreadsheet-import.mjs','test-center.mjs'],
            'status': 'trained_runtime_operational'
          }
          open('ops/trained-runtime-validation.json','w').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/trained-runtime-validation.json
          git commit -m "Valida runtime treinado em produção" || exit 0
          git push
