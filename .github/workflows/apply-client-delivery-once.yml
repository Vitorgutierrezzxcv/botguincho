name: Apply Client Delivery Once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-client-delivery-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply client delivery UI
        run: |
          python3 tools/apply_client_delivery_tmp.py
          node --check app.js
          node --check public/app.js
          grep -q 'Ajuda e segurança' public/index.html
          grep -q 'Configurações avançadas' public/index.html
      - name: Commit interface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html public/index.html app.js public/app.js app.css public/app.css sw.js public/sw.js
          git commit -m 'Simplifica painel para entrega ao cliente' || true
          git push
