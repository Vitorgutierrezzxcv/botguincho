name: Production Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PUBLIC_URL: https://botguincho.vercel.app
    steps:
      - name: Aguardar deployment da Vercel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO="${GITHUB_REPOSITORY}"
          SHA="${GITHUB_SHA}"
          for i in $(seq 1 30); do
            DEPLOYS=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/deployments?sha=$SHA")
            STATUS_URL=$(printf '%s' "$DEPLOYS" | jq -r '.[0].statuses_url // empty')
            if [ -n "$STATUS_URL" ]; then
              STATUSES=$(curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$STATUS_URL")
              STATE=$(printf '%s' "$STATUSES" | jq -r '.[0].state // empty')
              echo "Vercel state=$STATE"
              if [ "$STATE" = "success" ]; then sleep 8; exit 0; fi
              if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then exit 1; fi
            fi
            sleep 5
          done
          exit 1

      - name: Validar painel público
        run: |
          set -e
          curl -fsSL --retry 5 --retry-delay 3 --max-time 30 "$PUBLIC_URL/" -o /tmp/root.html
          grep -q 'WhatsApp e IA em um só painel' /tmp/root.html
          echo 'Painel novo: OK'

      - name: Validar status sem bloqueio e aguardar QR
        run: |
          set -e
          URL="$PUBLIC_URL/api/worker/status"
          SAW_FAST_RESPONSE=0
          for i in $(seq 1 24); do
            START=$(date +%s)
            CODE=$(curl -sS -L --max-time 25 -o /tmp/status.json -w '%{http_code}' "$URL")
            END=$(date +%s)
            ELAPSED=$((END-START))
            echo "Tentativa $i/24: HTTP $CODE em ${ELAPSED}s"
            cat /tmp/status.json || true
            echo
            if [ "$CODE" != "200" ]; then sleep 5; continue; fi
            SAW_FAST_RESPONSE=1
            STATUS=$(node -e "const x=require('/tmp/status.json');console.log(x.whatsapp?.status||'')")
            AI=$(node -e "const x=require('/tmp/status.json');console.log(Boolean(x.ai?.configured))")
            echo "whatsapp=$STATUS aiConfigured=$AI"
            if [ "$STATUS" = "qr" ] || [ "$STATUS" = "autenticado" ] || [ "$STATUS" = "pronto" ]; then
              echo 'Worker WhatsApp operacional: OK'
              exit 0
            fi
            if [ "$STATUS" = "erro" ]; then
              echo 'Worker reportou erro:' >&2
              cat /tmp/status.json >&2
              exit 1
            fi
            sleep 10
          done
          if [ "$SAW_FAST_RESPONSE" = "0" ]; then
            echo 'API de status continuou bloqueando.' >&2
          else
            echo 'API responde, mas WhatsApp não chegou ao QR no tempo esperado.' >&2
          fi
          exit 1
