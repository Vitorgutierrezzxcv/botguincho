name: Production Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Localizar deployment exato da Vercel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO="${GITHUB_REPOSITORY}"
          SHA="${GITHUB_SHA}"
          for i in $(seq 1 30); do
            echo "Procurando deployment do commit $SHA ($i/30)..."
            DEPLOYS=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/deployments?sha=$SHA")
            STATUS_URL=$(printf '%s' "$DEPLOYS" | jq -r '.[0].statuses_url // empty')
            if [ -n "$STATUS_URL" ]; then
              STATUSES=$(curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$STATUS_URL")
              STATE=$(printf '%s' "$STATUSES" | jq -r '.[0].state // empty')
              DEPLOY_URL=$(printf '%s' "$STATUSES" | jq -r '.[0].environment_url // .[0].target_url // empty')
              echo "Vercel state=$STATE url=$DEPLOY_URL"
              if [ "$STATE" = "success" ] && [ -n "$DEPLOY_URL" ]; then
                echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
                exit 0
              fi
              if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
                echo "Deployment da Vercel falhou." >&2
                exit 1
              fi
            fi
            sleep 5
          done
          echo "Não encontrei deployment concluído da Vercel para este commit." >&2
          exit 1

      - name: Inspecionar painel publicado
        run: |
          set +e
          echo "Testando $DEPLOY_URL"
          curl -sS -L --max-time 30 -D /tmp/root-headers.txt "$DEPLOY_URL/" -o /tmp/root.html
          CURL_EXIT=$?
          echo "curl_exit=$CURL_EXIT"
          echo "--- HEADERS ---"
          sed -n '1,30p' /tmp/root-headers.txt 2>/dev/null || true
          echo "--- BODY INICIAL ---"
          sed -n '1,40p' /tmp/root.html 2>/dev/null || true
          echo "--- FIM ---"
          if grep -q 'WhatsApp e IA em um só painel' /tmp/root.html 2>/dev/null; then
            echo 'Painel novo confirmado.'
          else
            echo 'Painel novo não pôde ser confirmado externamente; continuando para testar a API.'
          fi
          exit 0

      - name: Validar worker e geração da sessão
        run: |
          set +e
          URL="$DEPLOY_URL/api/worker/status"
          for i in $(seq 1 8); do
            echo "Tentativa $i/8 em $URL"
            rm -f /tmp/body.json /tmp/api-headers.txt
            CODE=$(curl -sS -L --max-time 58 -D /tmp/api-headers.txt -o /tmp/body.json -w '%{http_code}' "$URL")
            CURL_EXIT=$?
            echo "curl_exit=$CURL_EXIT http=$CODE"
            sed -n '1,25p' /tmp/api-headers.txt 2>/dev/null || true
            cat /tmp/body.json 2>/dev/null || true
            echo
            if [ "$CURL_EXIT" = "0" ] && [ "$CODE" = "200" ]; then
              node -e "const fs=require('fs');const raw=fs.readFileSync('/tmp/body.json','utf8');let x;try{x=JSON.parse(raw)}catch{process.exit(2)};if(!x.whatsapp||!x.whatsapp.status)process.exit(1);console.log('WhatsApp status:',x.whatsapp.status);console.log('AI configured:',x.ai?.configured);"
              RESULT=$?
              if [ "$RESULT" = "0" ]; then exit 0; fi
            fi
            sleep 8
          done
          echo 'Worker não ficou disponível.' >&2
          exit 1
