name: Fix learning JSON recovery now

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix-learning-json-recovery-tmp.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply JSON recovery fix
        run: python tools/fix-learning-json-recovery-tmp.py
      - name: Validate worker module
        run: node --check tools/learning-engine.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/learning-engine.mjs
          git commit -m "Corrige corrupção do aprendizado e tabelas comerciais"
          git push origin main
