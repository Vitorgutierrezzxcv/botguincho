name: Apply ETA city fallback once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-eta-city-fallback-once.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/apply-eta-city-fallback-patch.py
      - run: node --check tools/vercel-whatsapp-worker.mjs
      - run: node tools/test-address-normalization.mjs
      - run: node tools/test-operating-hours.mjs
      - run: node tools/test-cancellation-policy.mjs
      - run: node tools/test-worked-time-policy.mjs
      - run: node tools/test-driver-payroll.mjs
      - name: Commit validated patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/vercel-whatsapp-worker.mjs
          git commit -m "fix: garante fallback de ETA por cidade"
          git push origin main
