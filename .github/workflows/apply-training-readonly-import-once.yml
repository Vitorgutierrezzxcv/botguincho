name: Apply training readonly import once

on:
  push:
    branches: [main]
    paths:
      - 'ops/trigger-training-readonly-import.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply readonly training import guard
        run: node tools/apply-training-readonly-import.mjs
      - name: Validate runtime
        run: |
          set -euo pipefail
          node --check tools/vercel-whatsapp-worker.mjs
          node tools/test-learning-patterns.mjs
          node tools/test-operational-knowledge.mjs
          node tools/test-cancellation-policy.mjs
          node tools/test-worked-time-policy.mjs
          node tools/test-driver-payroll.mjs
          node tools/test-whatsapp-recovery.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tools/vercel-whatsapp-worker.mjs').read_text()
          start=s.index('async function importLearningHistory')
          block=s[start:start+1800]
          assert "group_not_authorized" not in block
          assert "visibleChats = await waClient.getChats()" in block
          assert "group_not_found" in block
          print('READONLY_TRAINING_IMPORT_GUARD_OK')
          PY
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-training-readonly-import-once.yml
          rm -f tools/apply-training-readonly-import.mjs
          git add -A
          git commit -m "fix: separa leitura de treinamento de grupos ativos"
          git push origin HEAD:main
