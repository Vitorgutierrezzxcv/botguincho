name: Fix Harden Workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-harden-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir substituicao Python
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/harden-universal-address-location.yml')
          s = p.read_text()
          old = "ns, n = pattern.subn(replacement.rstrip() + '\\n\\n', s, count=1)"
          new = "ns, n = pattern.subn(lambda _m: replacement.rstrip() + '\\n\\n', s, count=1)"
          if old not in s:
              raise SystemExit('linha alvo nao encontrada')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/harden-universal-address-location.yml
          git commit -m 'Corrige patch universal de endereco'
          git push origin HEAD:main
