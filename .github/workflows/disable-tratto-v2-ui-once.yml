name: Disable Tratto V2 UI once

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-disable-tratto-v2-ui.py'
      - '.github/workflows/disable-tratto-v2-ui-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore stable UI
        run: python tools/apply-disable-tratto-v2-ui.py
      - name: Commit restoration
        run: |
          if git diff --quiet -- public/index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Restaura interface estável do Acionador'
          git push origin main
