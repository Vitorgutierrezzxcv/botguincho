name: Fix Multitenant Runtime V2
on:
  push:
    paths:
      - 'tools/fix_multitenant_runtime_v2.py'
      - '.github/workflows/fix-multitenant-runtime-v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python3 tools/fix_multitenant_runtime_v2.py
      - name: Validate syntax and stale references
        run: |
          node --check lib/sandbox-runtime.js
          ! grep -q 'tenantCredential(id), id' lib/sandbox-runtime.js
          ! grep -q 'startWorkerDetached(sandbox, id).*return req.method' lib/sandbox-runtime.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/sandbox-runtime.js
          git diff --cached --quiet || git commit -m 'Corrige referencias finais do runtime multiempresa'
          git push
