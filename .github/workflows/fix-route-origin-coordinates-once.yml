name: Fix route origin coordinates once
on:
  push:
    branches: [main]
    paths:
      - 'ops/trigger-fix-route-origin-coordinates.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 tools/fix_route_origin_coordinates_tmp.py
      - run: node --check tools/vercel-whatsapp-worker.mjs
      - run: |
          grep -q "originCoordinates = null" tools/vercel-whatsapp-worker.mjs
          grep -q "originCoordinates: state.originCoordinates" tools/vercel-whatsapp-worker.mjs
          grep -q "originCoordinates: call?.originCoordinates" tools/vercel-whatsapp-worker.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/vercel-whatsapp-worker.mjs
          git commit -m "Preserva localização compartilhada no cálculo da rota completa" || exit 0
          git push
