name: Fix ETA Intent Boundaries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-eta-intent-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: write
  deployments: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir caracteres de boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/vercel-whatsapp-worker.mjs')
          b = p.read_bytes()
          count = b.count(b'\x08')
          print(f'backspace encontrados: {count}')
          if count != 4:
              raise SystemExit(f'Esperava 4 caracteres de controle nas duas regex, encontrei {count}')
          b = b.replace(b'\x08', b'\\b')
          p.write_bytes(b)
          if b'\x08' in p.read_bytes():
              raise SystemExit('Ainda existe backspace no arquivo')
          PY

      - name: Testar as regex extraídas do código real
        run: |
          node --check tools/vercel-whatsapp-worker.mjs
          node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('tools/vercel-whatsapp-worker.mjs', 'utf8');
          if (src.includes('\b')) process.exit(1);

          function getRegex(fn) {
            const start = src.indexOf(`function ${fn}(`);
            if (start < 0) throw new Error(`${fn} não encontrada`);
            const end = src.indexOf('\n}', start);
            const block = src.slice(start, end + 2);
            const m = block.match(/return \/(.+)\/\.test\(value\);/);
            if (!m) throw new Error(`regex de ${fn} não encontrada`);
            return new RegExp(m[1]);
          }
          function norm(value) {
            return String(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
          }
          const eta = getRegex('asksEta');
          const distance = getRegex('asksDistance');
          const tests = [
            [eta, 'Temp até chegar no cliente, qual seria?'],
            [eta, 'Quanto tempo para chegar?'],
            [eta, 'Qual o tempo até chegar?'],
            [distance, 'Qual a distância?'],
            [distance, 'Quantos km até o cliente?'],
          ];
          for (const [re, text] of tests) {
            if (!re.test(norm(text))) throw new Error(`Não reconheceu: ${text}`);
            console.log(`OK: ${text}`);
          }
          if (eta.test(norm('Bom dia'))) throw new Error('Falso positivo em Bom dia');
          if (distance.test(norm('Bom dia'))) throw new Error('Falso positivo em Bom dia');
          NODE

      - name: Commitar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/vercel-whatsapp-worker.mjs
          git commit -m 'Corrige boundaries das intents de ETA e distância'
          git push origin HEAD:main

      - name: Recarregar worker persistente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          sleep 4
          CODE=$(curl -sS -L --max-time 180 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/json' \
            -o /tmp/reload.json -w '%{http_code}' \
            https://botguincho.vercel.app/api/worker/reload || true)
          cat /tmp/reload.json; echo
          test "$CODE" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/reload.json', 'utf8'));
          if (!x.ok || x.whatsappStatus !== 'pronto' || x.workerProcessCount !== 1) process.exit(1);
          console.log('Worker atualizado e WhatsApp pronto.');
          NODE

      - name: Validar classificação em produção
        run: |
          set -e
          for TEXT in 'Qual a distância?' 'Temp até chegar no cliente, qual seria?'; do
            curl -fsSL --max-time 45 -X POST https://botguincho.vercel.app/api/worker/ai-test \
              -H 'content-type: application/json' \
              --data "$(jq -nc --arg text "$TEXT" '{text:$text}')" -o /tmp/intent.json
            cat /tmp/intent.json; echo
            node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/intent.json', 'utf8'));
          if (!x.ok || x.ignored === true) process.exit(1);
          NODE
          done

      - name: Validar rota e conexões
        run: |
          set -e
          curl -fsSL --max-time 60 -X POST https://botguincho.vercel.app/api/worker/route-test \
            -H 'content-type: application/json' \
            -d '{"from":"Rua das Rosas, 310, São Salvador, Betim - Minas Gerais","to":"RUA DOUTOR CAMILO ANTÔNIO NOGUEIRA, nº 100, NOSSA SENHORA DA CONCEIÇÃO, BELO HORIZONTE - MG"}' \
            -o /tmp/route.json
          cat /tmp/route.json; echo
          curl -fsSL --max-time 30 https://botguincho.vercel.app/api/worker/status -o /tmp/status.json
          cat /tmp/status.json; echo
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/route.json', 'utf8'));
          const s = JSON.parse(fs.readFileSync('/tmp/status.json', 'utf8'));
          if (!r.ok || !Number.isFinite(r.route?.minutes) || !Number.isFinite(r.route?.distanceKm)) process.exit(1);
          if (s.whatsapp?.status !== 'pronto' || !s.tracker?.connected || s.tracker?.lastLocation?.plate !== 'GSW0H17') process.exit(1);
          console.log(`FINAL OK: ${r.route.minutes} min · ${r.route.distanceKm} km; WhatsApp e GConnect conectados.`);
          NODE
