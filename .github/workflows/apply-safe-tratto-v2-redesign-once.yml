name: Apply safe Acionador redesign once

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-safe-tratto-v2-redesign.py'
      - '.github/workflows/apply-safe-tratto-v2-redesign-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply-safe-tratto-v2-redesign.py
      - name: Validate JavaScript
        run: node --check public/acionador-tratto-v2.js && node --check public/app.js && node --check public/owner-dashboard.js
      - name: Commit redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/acionador-tratto-v2.js public/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Ativa redesign seguro do Acionador'
          git push origin main
