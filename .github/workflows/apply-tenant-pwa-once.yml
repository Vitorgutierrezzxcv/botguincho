name: Apply Tenant PWA Once
on:
  push:
    paths:
      - 'tools/apply_tenant_pwa_tmp.py'
      - '.github/workflows/apply-tenant-pwa-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_tenant_pwa_tmp.py
      - name: Validate
        run: |
          node --check app.js
          node --check public/app.js
          grep -q 'activeCompanyId' app.js
          grep -q 'x-botguincho-company-id' app.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js public/app.js sw.js public/sw.js
          git diff --cached --quiet || git commit -m 'Faz PWA respeitar empresa ativa'
          git push