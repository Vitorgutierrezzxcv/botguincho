name: Apply mobile V4 once

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-mobile-v4.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply mobile V4
        run: python tools/apply-mobile-v4.py
      - name: Validate JS
        run: node --check public/acionador-mobile-v4.js && node --check public/acionador-tratto-v2.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Ativa navegação flutuante e layout mobile V4'
          git push origin main
