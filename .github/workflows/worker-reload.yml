name: WhatsApp Worker Reload

on:
  push:
    branches: [main]
    paths:
      - 'tools/vercel-whatsapp-worker.mjs'
      - 'tools/gconnect-emulator-agent.mjs'
      - 'tools/install-gconnect-agent.sh'
      - 'api/worker/reload.js'
      - 'api/worker/tracker-bridge.js'
      - 'api/worker/route-test.js'
      - '.github/workflows/worker-reload.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: botguincho-worker-reload
  cancel-in-progress: true

jobs:
  reload:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Aguardar deployment da Vercel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REPO="${GITHUB_REPOSITORY}"
          SHA="${GITHUB_SHA}"
          for i in $(seq 1 48); do
            DEPLOYS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/deployments?sha=$SHA")
            STATUS_URL=$(printf '%s' "$DEPLOYS" | jq -r '.[0].statuses_url // empty')
            if [ -n "$STATUS_URL" ]; then
              STATUSES=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$STATUS_URL")
              STATE=$(printf '%s' "$STATUSES" | jq -r '.[0].state // empty')
              echo "Vercel state=$STATE"
              if [ "$STATE" = "success" ]; then sleep 5; exit 0; fi
              if [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then exit 1; fi
            fi
            sleep 5
          done
          exit 1

      - name: Validar arquivos do agente Android
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/tools/gconnect-emulator-agent.mjs" -o /tmp/gconnect-agent.mjs
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/tools/install-gconnect-agent.sh" -o /tmp/install-gconnect-agent.sh
          node --check /tmp/gconnect-agent.mjs
          bash -n /tmp/install-gconnect-agent.sh
          echo "Agente Node e instalador Bash: sintaxe OK."

      - name: Atualizar worker preservando sessão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          CODE=$(curl -sS -L --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-BotGuincho-Source-Ref: $GITHUB_SHA" \
            -H "Content-Type: application/json" \
            -o /tmp/reload.json -w '%{http_code}' \
            https://botguincho.vercel.app/api/worker/reload)
          echo "HTTP $CODE"
          cat /tmp/reload.json
          echo
          test "$CODE" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/reload.json', 'utf8'));
          if (!x.ok) process.exit(1);
          if (x.whatsappStatus !== 'pronto') process.exit(1);
          if (x.sourceRef !== process.env.GITHUB_SHA) process.exit(1);
          if (!Number.isFinite(x.groupsFound) || x.groupsFound < 1) process.exit(1);
          console.log(`WhatsApp pronto; sourceRef=${x.sourceRef}; ${x.groupsFound} grupo(s); sessão preservada=${x.sessionPreserved}`);
          NODE

      - name: Validar grupos pela API pública
        run: |
          curl -fsSL --retry 4 --retry-delay 3 --max-time 30 https://botguincho.vercel.app/api/worker/groups -o /tmp/groups.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/groups.json', 'utf8'));
          if (!Array.isArray(x.groups) || x.groups.length < 1) process.exit(1);
          console.log(`API pública: ${x.groups.length} grupo(s).`);
          NODE

      - name: Validar ETA real com os endereços do teste
        run: |
          set -e
          cat >/tmp/route.json <<'JSON'
          {
            "from": "Rua das Rosas, 310, São Salvador, Betim - Minas Gerais",
            "to": "Rua Doutor Camilo Antônio Nogueira, 100, Nossa Senhora da Conceição, Belo Horizonte - MG"
          }
          JSON
          CODE=$(curl -sS -L --max-time 60 -X POST \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/route.json \
            -o /tmp/route-result.json -w '%{http_code}' \
            https://botguincho.vercel.app/api/worker/route-test)
          echo "HTTP $CODE"
          cat /tmp/route-result.json
          echo
          test "$CODE" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/route-result.json', 'utf8'));
          if (!x.ok) process.exit(1);
          if (!Number.isFinite(x.route?.minutes) || x.route.minutes < 1) process.exit(1);
          if (!Number.isFinite(x.route?.distanceKm) || x.route.distanceKm <= 0) process.exit(1);
          console.log(`ETA validado: ${x.route.minutes} min · ${x.route.distanceKm} km`);
          NODE

      - name: Validar frases de ETA e distância em produção
        run: |
          set -e
          for TEXT in 'Qual a distância?' 'Temp até chegar no cliente, qual seria?'; do
            curl -fsSL --max-time 45 -X POST https://botguincho.vercel.app/api/worker/ai-test \
              -H 'content-type: application/json' \
              --data "$(jq -nc --arg text "$TEXT" '{text:$text}')" -o /tmp/intent.json
            echo "$TEXT"
            cat /tmp/intent.json; echo
            node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/intent.json', 'utf8'));
          if (!x.ok || x.ignored === true) process.exit(1);
          NODE
          done

      - name: Validar GConnect Android sem alterar leitura real
        run: |
          set -e
          curl -fsSL --retry 4 --retry-delay 3 --max-time 30 https://botguincho.vercel.app/api/worker/tracker -o /tmp/tracker.json
          cat /tmp/tracker.json
          echo
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/tracker.json', 'utf8'));
          if (x.provider !== 'gconnect-emulator') process.exit(1);
          if (x.mode !== 'android-ui-automation') process.exit(1);
          if (!/^[A-Z0-9]{8}$/.test(x.pairCode || '')) process.exit(1);
          if (!x.connected) process.exit(1);
          if (x.lastLocation?.plate !== 'GSW0H17') process.exit(1);
          if (!x.lastLocation?.address) process.exit(1);
          console.log(`GConnect conectado sem sobrescrever leitura: ${x.lastLocation.plate} · ${x.lastLocation.address}`);
          NODE
