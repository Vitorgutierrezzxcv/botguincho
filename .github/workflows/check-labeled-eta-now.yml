name: Check Labeled ETA Now
on:
  push:
    paths: ['.github/workflows/check-labeled-eta-now.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar produção
        run: |
          set +e
          curl -sS --get --data-urlencode 'address=RUA JOSE AUGUSTO DE OLIVEIRA 175, BAIRRO: PETROPOLIS, CIDADE: BETIM, ESTADO: MG, PAS: BRASIL' 'https://botguincho.vercel.app/api/worker/route-test?companyId=cliente-teste' -o /tmp/a.json
          curl -sS --get --data-urlencode 'address=RODOVIA SENADOR ELISEU RESENDE - BAIRRO: BOA VISTA DA SERRA, CIDADE: JUATUBA, ESTADO: MINAS GERAIS' 'https://botguincho.vercel.app/api/worker/route-test?companyId=cliente-teste' -o /tmp/b.json
          curl -sS 'https://botguincho.vercel.app/api/worker/health?companyId=cliente-teste' -o /tmp/h.json
          node <<'NODE'
          const fs=require('fs'); const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {raw:fs.readFileSync(p,'utf8')}}}; fs.mkdirSync('ops',{recursive:true}); fs.writeFileSync('ops/labeled-eta-now.json',JSON.stringify({checkedAt:new Date().toISOString(),honda:read('/tmp/a.json'),juatuba:read('/tmp/b.json'),health:read('/tmp/h.json')},null,2));
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/labeled-eta-now.json
          git commit -m 'Registra teste imediato do ETA rotulado' || exit 0
          git push
