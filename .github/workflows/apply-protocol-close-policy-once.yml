name: Apply protocol and close summary policy once

# rerun with corrected patcher
on:
  push:
    paths:
      - '.github/workflows/apply-protocol-close-policy-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply policy patch
        run: python ops/apply-protocol-close-policy.py
      - name: Validate syntax
        run: |
          node --check tools/vercel-whatsapp-worker.mjs
          node --check tools/operational-knowledge.mjs
          node --check tools/test-close-summary-and-protocol-policy.mjs
      - name: Run protocol and operational regressions
        run: |
          node tools/test-protocol-call-matching.mjs
          node tools/test-operational-knowledge.mjs
          node tools/test-close-summary-and-protocol-policy.mjs
          node tools/test-simple-operation.mjs
          node tools/test-driver-payroll.mjs
      - name: Commit final fix
        run: |
          rm -f .github/workflows/apply-protocol-close-policy-once.yml ops/apply-protocol-close-policy.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Melhora fechamento e trata protocolo como cotação quando necessário'
          git push origin main
