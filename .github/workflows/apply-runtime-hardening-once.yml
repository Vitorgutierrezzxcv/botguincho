name: Apply runtime hardening once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-runtime-hardening-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Concluir correções de consistência
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('api/worker/reload.js')
          s = p.read_text()
          old = "  'tools/simple-operation.mjs',\n  'tools/historical-spreadsheet-import.mjs',"
          new = "  'tools/simple-operation.mjs',\n  'tools/tracker-freshness.mjs',\n  'tools/historical-spreadsheet-import.mjs',"
          if s.count(old) != 1:
              raise SystemExit(f'reload runtime files: {s.count(old)} ocorrencias')
          p.write_text(s.replace(old, new, 1))

          p = Path('tools/vercel-whatsapp-worker.mjs')
          s = p.read_text()
          old = "async function getManagement() {\n  return normalizeManagement(await readJson(managementFile, DEFAULT_MANAGEMENT));\n}"
          new = "async function getManagement() {\n  const state = normalizeManagement(await readJson(managementFile, DEFAULT_MANAGEMENT));\n  const mainTruck = (state.fleet || []).find((item) => item?.id === 'fleet-gsw0h17' || String(item?.plate || '').toUpperCase() === 'GSW0H17');\n  if (mainTruck && !String(mainTruck.driver || '').trim()) {\n    mainTruck.driver = 'Mauro';\n    return saveManagement(state);\n  }\n  return state;\n}"
          if s.count(old) != 1:
              raise SystemExit(f'management migration: {s.count(old)} ocorrencias')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Validar código e regressões
        run: |
          set -euo pipefail
          node --check api/worker/reload.js
          node --check tools/tracker-freshness.mjs
          node --check tools/vercel-whatsapp-worker.mjs
          node tools/test-tracker-freshness.mjs
          node tools/test-learning-patterns.mjs
          node tools/test-operational-knowledge.mjs
          node tools/test-cancellation-policy.mjs
          node tools/test-worked-time-policy.mjs
          node tools/test-driver-payroll.mjs
          node tools/test-simple-operation.mjs
          grep -q "'tools/tracker-freshness.mjs'" api/worker/reload.js
          grep -q "mainTruck.driver = 'Mauro'" tools/vercel-whatsapp-worker.mjs

      - name: Commitar conclusão
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/worker/reload.js tools/vercel-whatsapp-worker.mjs
          git commit -m "fix: conclui consistência do runtime persistente"
          git push origin main
