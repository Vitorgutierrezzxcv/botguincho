name: Apply learning context once
on:
  push:
    paths:
      - 'tools/apply_learning_context_tmp.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_learning_context_tmp.py
      - run: node --check tools/vercel-whatsapp-worker.mjs
      - run: node tools/test-learning-patterns.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/vercel-whatsapp-worker.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Conecta aprendizado contínuo ao contexto da IA"
          git push
