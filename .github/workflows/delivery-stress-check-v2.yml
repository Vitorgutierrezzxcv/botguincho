name: Delivery Stress Check V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/delivery-stress-check-v2.yml']
  workflow_dispatch:
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait production deploy
        run: sleep 75
      - name: Core health
        run: |
          set -e
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 --max-time 120 https://botguincho.vercel.app/api/worker/status -o /tmp/status.json
          cat /tmp/status.json; echo
          jq -e '.whatsapp.status=="pronto" and .tracker.connected==true and .tracker.stale==false' /tmp/status.json >/dev/null
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 --max-time 120 https://botguincho.vercel.app/api/worker/health -o /tmp/health.json
          cat /tmp/health.json; echo
          jq -e '.status=="operational" and .checks.whatsapp.ok==true and .checks.tracker.ok==true and .checks.routes.ok==true' /tmp/health.json >/dev/null
      - name: Route matrix RMBH
        run: |
          set -e
          test_route(){ local address="$1"; echo "TEST: $address"; curl -fsSL --max-time 120 -X POST https://botguincho.vercel.app/api/worker/route-test -H 'content-type: application/json' -d "$(jq -nc --arg a "$address" '{fromTracker:true,to:$a}')" -o /tmp/route.json; cat /tmp/route.json; echo; jq -e '.ok==true and .route.minutes>0 and .route.distanceKm>0' /tmp/route.json >/dev/null; }
          test_route 'Av. Otacilio Negrao de Lima, s/n, Belo Horizonte'
          test_route 'Avenida Juscelino Kubitschek, 229, Centro, Betim'
          test_route 'Avenida Joao Cesar de Oliveira, Centro, Contagem'
          test_route 'LMG-800, Km 7.9, Confins - MG'
          test_route 'Praca Bernardino de Lima, Nova Lima - MG'
          test_route 'Rua Ari Teixeira da Costa, Ribeirao das Neves - MG'
      - name: Reject outside Minas Gerais
        run: |
          CODE=$(curl -sSL --max-time 120 -o /tmp/outside.json -w '%{http_code}' -X POST https://botguincho.vercel.app/api/worker/route-test -H 'content-type: application/json' -d '{"fromTracker":true,"to":"Avenida Paulista, 1000, Sao Paulo - SP"}')
          cat /tmp/outside.json; echo; echo "HTTP $CODE"
          test "$CODE" = "422"
          jq -e '.ok==false' /tmp/outside.json >/dev/null
      - name: Management audit and PWA
        run: |
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 https://botguincho.vercel.app/api/worker/management -o /tmp/mgmt.json
          jq -e '.ok==true and (.data.calls|type)=="array" and (.data.finance|type)=="array"' /tmp/mgmt.json >/dev/null
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 'https://botguincho.vercel.app/api/worker/audit?limit=20' -o /tmp/audit.json
          jq -e '.ok==true and (.entries|type)=="array"' /tmp/audit.json >/dev/null
          curl -fsSL https://botguincho.vercel.app/ -o /tmp/index.html
          curl -fsSL https://botguincho.vercel.app/app.js -o /tmp/app.js
          grep -q 'Saúde da automação' /tmp/index.html
          node --check /tmp/app.js
          echo 'DELIVERY_STRESS_V2_OK'
