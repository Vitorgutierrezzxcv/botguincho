name: Apply owner close fix

on:
  push:
    branches: [main]
    paths:
      - 'ops/apply-owner-close-fix.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 ops/apply-owner-close-fix.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check owner-dashboard.js
          node --check public/owner-dashboard.js
          node --check tools/vercel-whatsapp-worker.mjs
          node tools/test-simple-operation.mjs
          node tools/test-driver-payroll.mjs
      - name: Commit
        run: |
          set -euo pipefail
          rm -f ops/apply-owner-close-fix.trigger
          rm -f ops/apply-owner-close-fix.py
          rm -f ops/fix-owner-close-modal.trigger
          rm -f .github/workflows/fix-owner-close-modal-once.yml
          rm -f .github/workflows/fix-owner-close-modal-run.yml
          rm -f .github/workflows/apply-owner-close-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fecha modal após concluir corrida e evita duplicidade"
          git push origin main
