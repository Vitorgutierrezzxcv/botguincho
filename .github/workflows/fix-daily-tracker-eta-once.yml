name: Fix daily tracker ETA once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-daily-tracker-eta-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir diagnostico de ETA e conectividade do tracker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('api/worker/tracker.js')
          s = p.read_text()
          imp = "import { requestTenant } from '../../lib/sandbox-runtime.js';\n"
          if "trackerAgeSeconds" not in s:
              s = s.replace(imp, imp + "import { trackerAgeSeconds } from '../../tools/tracker-freshness.mjs';\n", 1)
          start = s.find('function finiteTimestamp(value) {')
          end = s.find('export default async function handler')
          if start >= 0 and end > start:
              s = s[:start] + s[end:]
          old = "const timestamp = sourceTimestamp(safe.lastLocation);\n    const ageSeconds = timestamp === null ? null : Math.max(0, Math.round((Date.now() - timestamp) / 1000));\n    const connected = ageSeconds !== null && ageSeconds <= 90;"
          new = "const ageSeconds = trackerAgeSeconds(safe.lastLocation);\n    const connected = ageSeconds !== null && ageSeconds <= 120;"
          if old not in s:
              raise SystemExit('Bloco antigo de idade do tracker nao encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tools/vercel-whatsapp-worker.mjs')
          s = p.read_text()
          old = "else if (route.originAddress || route.originCoordinates) lines.push('Não consegui localizar a origem com precisão suficiente para calcular a prévia. Envie a localização do WhatsApp ou confirme a cidade/UF.');"
          new = """else if (route.originAddress || route.originCoordinates) {
              const currentTracker = await getTrackerReading().catch(() => null);
              const currentTrackerAge = trackerAgeSeconds(currentTracker);
              if (!currentTracker || currentTrackerAge === null || currentTrackerAge > 120) {
                lines.push('Rastreador do guincho sem atualização recente. Não consigo calcular a previsão de chegada com segurança agora.');
              } else {
                lines.push('Não consegui calcular a rota até a origem informada. Se possível, envie a localização do WhatsApp.');
              }
            }"""
          if old not in s:
              raise SystemExit('Fallback antigo de origem nao encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tools/test-whatsapp-address-fields.mjs')
          s = p.read_text()
          marker = "// Garante que o caminho de rota tambem remove markdown e rotulos antes do geocoder.\n"
          block = """const mateusLemeCase = `*MODELO:* VW - VOLKSWAGEN/GOL SPECIAL 1.0 TOTAL FLEX 8V 5P
          *SERVIÇOS:*
          *ENDEREÇO ORIGEM:* RUA DOIS 85, BAIRRO: NOSSA SENHORA DE FATIMA, CIDADE: MATEUS LEME, ESTADO: MG, PAS: BRASIL, REF: CASA04 1 pessoa acompanha
          *ENDEREÇO DESTINO:* RUA IGNES MARIA 326, BAIRRO: BETIM INDUSTRIAL, CIDADE: BETIM, ESTADO: MG, PAS: BRASIL, REF: CASA04 1 pessoa acompanha`;
          const mateusFacts = extractOperationalFacts(mateusLemeCase);
          assert.equal(mateusFacts.origin, 'RUA DOIS 85, NOSSA SENHORA DE FATIMA, MATEUS LEME, MG, BRASIL');
          assert.equal(mateusFacts.destination, 'RUA IGNES MARIA 326, BETIM INDUSTRIAL, BETIM, MG, BRASIL');
          assert.doesNotMatch(mateusFacts.origin, /BAIRRO:|CIDADE:|ESTADO:|PAS:/i);

          """
          if 'const mateusLemeCase' not in s:
              if marker not in s:
                  raise SystemExit('Marcador do teste de endereco nao encontrado')
              s = s.replace(marker, block + marker, 1)

          # Este assert verificava a implementação interna antiga do parser e ficou obsoleto.
          # Mantemos os asserts funcionais acima e validamos o normalizador que o runtime usa hoje.
          stale = "assert.match(workerSource, /BAIRRO\\|CIDADE\\|ESTADO\\|PA\\[IÍ\\]S\\|PAS/);\n"
          s = s.replace(stale, '')
          anchor = "assert.match(workerSource, /lineWithoutWhatsAppMarkup/);\n"
          extra = "assert.match(workerSource, /normalizeAddressInput/);\nassert.match(workerSource, /Rastreador do guincho sem atualização recente/);\nassert.doesNotMatch(workerSource, /Não consegui localizar a origem com precisão suficiente/);\n"
          if 'assert.match(workerSource, /normalizeAddressInput/);' not in s:
              if anchor not in s:
                  raise SystemExit('Assert base do worker nao encontrado')
              s = s.replace(anchor, anchor + extra, 1)
          p.write_text(s)

          Path('ops/recover-gconnect.sh').write_text(r'''#!/usr/bin/env bash
          set -Eeuo pipefail
          if [ "$(id -u)" -ne 0 ]; then
            echo "Execute como root: sudo bash ops/recover-gconnect.sh"
            exit 1
          fi
          AGENT=botguincho-gconnect.service
          EMULATOR=botguincho-android-emulator.service
          TIMER=botguincho-gconnect-watchdog.timer
          for unit in "$AGENT" "$EMULATOR" "$TIMER"; do
            if ! systemctl cat "$unit" >/dev/null 2>&1; then
              echo "Unidade $unit nao encontrada."
              exit 2
            fi
          done
          systemctl daemon-reload
          systemctl enable "$AGENT" "$EMULATOR" "$TIMER" >/dev/null
          systemctl restart "$EMULATOR"
          echo "Aguardando Android/ADB..."
          sleep 20
          systemctl restart "$AGENT"
          systemctl restart "$TIMER"
          sleep 8
          echo "=== Servicos ==="
          systemctl is-active "$EMULATOR" "$AGENT" "$TIMER"
          echo "=== Watchdog ==="
          systemctl --no-pager --full status "$TIMER" | head -20 || true
          echo "=== Agente ==="
          journalctl -u "$AGENT" -n 35 --no-pager || true
          ''')
          Path('ops/recover-gconnect.sh').chmod(0o755)
          PY

      - name: Validar regressões
        run: |
          set -euo pipefail
          node --check api/worker/tracker.js
          node --check tools/vercel-whatsapp-worker.mjs
          node tools/test-tracker-freshness.mjs
          node tools/test-whatsapp-address-fields.mjs
          node tools/test-operating-hours.mjs
          node tools/test-complete-operational-flows.mjs
          grep -q "trackerAgeSeconds(safe.lastLocation)" api/worker/tracker.js
          grep -q "Rastreador do guincho sem atualização recente" tools/vercel-whatsapp-worker.mjs
          grep -q "RUA DOIS 85" tools/test-whatsapp-address-fields.mjs

      - name: Consolidar uma unica correcao
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/worker/tracker.js tools/vercel-whatsapp-worker.mjs tools/test-whatsapp-address-fields.mjs ops/recover-gconnect.sh
          git commit -m "Corrige falha recorrente do rastreador e ETA"
          git push origin HEAD:main
