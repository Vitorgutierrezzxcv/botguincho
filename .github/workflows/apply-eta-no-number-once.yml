name: Apply ETA no-number fix once

on:
  push:
    branches:
      - "fix/eta-sem-numero-20260829"
    paths:
      - ".github/workflows/apply-eta-no-number-once.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/eta-sem-numero-20260829"
          fetch-depth: 0
      - run: python3 tools/apply-eta-no-number-patch.py
      - run: node tools/test-address-normalization.mjs
      - run: node --check tools/vercel-whatsapp-worker.mjs
      - run: node tools/test-operating-hours.mjs
      - run: node tools/test-cancellation-policy.mjs
      - run: node tools/test-worked-time-policy.mjs
      - run: node tools/test-driver-payroll.mjs
      - name: Commit validated patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-eta-no-number-once.yml tools/apply-eta-no-number-patch.py
          git add -A
          git commit -m "fix: garante previa para enderecos sem numero"
          git push origin HEAD:fix/eta-sem-numero-20260829
