services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.vps
    restart: unless-stopped
    env_file:
      - .env.vps
    environment:
      BOTGUINCHO_DATA_DIR: /data
      BOTGUINCHO_PLATFORM_PORT: "3001"
      WHATSAPP_CLIENT_ID: cliente-teste
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      TZ: America/Sao_Paulo
    expose:
      - "3001"
    volumes:
      - /opt/botguincho-data:/data
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - worker
    environment:
      BOTGUINCHO_DOMAIN: ${BOTGUINCHO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile.vps:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
